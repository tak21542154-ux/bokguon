<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>복구온 — 오프라인</title>
<link rel="stylesheet" href="{{ asset('fonts.css') }}">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0A4C86;
    color:#fff;font-family:'Pretendard','맑은 고딕',sans-serif;text-align:center;padding:24px}
  .box{max-width:360px}
  .lg{font-weight:800;font-size:1.6rem;margin-bottom:8px}
  .lg b{color:#E8A33D}
  p{color:rgba(255,255,255,.82);line-height:1.7;font-size:.92rem}
  button{margin-top:18px;background:#fff;color:#0064B2;border:0;border-radius:99px;
    padding:11px 26px;font-weight:800;font-size:.9rem;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <div class="lg">복구<b>온</b></div>
    <p>지금 인터넷에 연결되어 있지 않습니다.<br>연결을 확인한 뒤 다시 시도해 주세요.<br>
       사건·정산 정보는 온라인에서 안전하게 확인됩니다.</p>
    <button id="retryBtn">다시 시도</button>
  </div>
  <script nonce="{{ csp_nonce }}">
  //  ⚠⚠ [라운드319] onclick="..." 인라인 이벤트 핸들러는 nonce 를 붙일 자리가
  //    없어 CSP(script-src 'nonce-...', unsafe-inline 없음)가 무조건 차단한다
  //    — actions.js 자신의 독스트링이 이미 밝힌 바로 그 이유. 이 페이지는
  //    가벼운 오프라인 셸이라 무거운 actions.js 대신, nonce 가 붙은 이
  //    <script> 안에서 addEventListener 로 직접 연결한다.
  document.getElementById('retryBtn').addEventListener('click', () => location.reload());
  </script>
</body>
</html>
