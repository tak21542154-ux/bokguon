.appbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:130;

  justify-content:center;box-shadow:0 0 0 2px #fff;letter-spacing:-.02em;pointer-events:none}

     앱(standalone)은 좌우 안전영역까지 먹어서 더 심했다.
     화면보다 넓어질 수 없게 묶고, 높이도 화면 기준으로 잡는다. */
.bellpop{position:absolute;top:calc(100% + 8px);right:0;width:min(340px,calc(100vw - 24px));

    if(wrap && wrap.parentNode) wrap.parentNode.insertBefore(b, wrap);
  }
  b.innerHTML = '📴 지금 통신이 끊겨 <b>마지막으로 받은 내용</b>을 보여 드립니다 — '
    + '수락·보고는 신호가 돌아온 뒤에 됩니다. 사진은 지금 찍어 두면 자동으로 올라갑니다.';
}

//  마지막 요청이 **서비스워커 캐시**에서 왔는가. 오프라인 안내에 쓴다.
//   ⚠ 오래된 값을 최신으로 오인하면 기사가 끝난 일을 다시 하러 간다.
let OFFLINE_COPY = false;

async function api(method, url, body){
  const headers = {'Content-Type':'application/json'};
  if(method!=='GET' && CSRF) headers['X-CSRF-Token'] = CSRF;
  const opt = {method, headers, credentials:'same-origin'};
  if(body) opt.body = JSON.stringify(body);
  const r = await fetch(url, opt);
  //  서비스워커가 마지막 사본을 돌려준 경우 표식을 남긴다(화면이 "언제 기준"인지 말한다)
  OFFLINE_COPY = (r.headers && r.headers.get('X-From-Cache') === '1');
  // 세션이 만료되면 CSRF 토큰도 함께 무효가 되어 403 이 먼저 떨어진다.
  // 403 을 그냥 오류로 처리하면 사용자는 로그인 화면으로 가지 못하고 갇힌다.
  //  ⚠ 업로드가 도는 중에 30초 알림 폴링이 401 을 만나면, 예전에는 그대로
  //    로그인 화면으로 튕겨 **아직 안 보낸 사진이 증발**했다(기사는 올린 줄 안다).
  //    지금은 기기 큐에 먼저 저장하므로 유실은 없지만, 업로드 중 강제 이동은
  //    여전히 진행을 끊는다 — 업로드가 끝난 뒤로 미룬다.
  if(r.status===401){
    if(UP_BUSY){ throw new Error('auth-deferred'); }
    location.href='/partner/login'; throw new Error('auth');
  }
  //  ★ **403 은 두 가지다** — '세션이 끊겼다'와 '이 계정은 그 일을 할 수 없다'.
  //    둘을 뭉쳐 로그인 화면으로 보내면, 서버가 정확히 적어 보낸 사유
  //    ("이 작업은 중간관리자 이상만…")가 통째로 버려지고 사용자는
  //    재로그인 → 같은 버튼 → 또 튕김 을 반복한다(계정 장애로 오인해 신고한다).
  if(r.status===403){
    const d0 = await r.json().catch(()=>({}));
    if(d0.code==='FORBIDDEN' || d0.code==='PORTAL_FORBIDDEN'){
      throw new Error(d0.error || '이 계정에는 권한이 없습니다.');
    }
    if(UP_BUSY){ throw new Error('auth-deferred'); }
    location.href='/partner/login'; throw new Error('auth');
  }
  //  ⚠ 서버가 오류번호(ref)를 붙여 보내는데 본문을 읽기도 전에 버리면,
  //    문의를 받아도 로그에서 그 요청을 찾을 방법이 없다. 번호만 함께 보여 준다.
  if(r.status>=500){
    const d5 = await r.json().catch(()=>({}));
    throw new Error('서버에 일시적인 문제가 있습니다. 잠시 후 다시 시도해 주세요.'
                    + (d5 && d5.ref ? ` (오류번호 ${d5.ref})` : ''));
  }
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||'요청 실패');
  return d;
}
//  ⚠ 로그아웃하면 **서비스워커 사본까지** 지운다.
//    sw 는 대시보드 응답을 URL 만 열쇠로 캐시한다 — 계정 구분이 없다.
//    다른 협력사 계정으로 갈아탄 직후 네트워크가 잠깐 끊기면 그 사본이
//    그대로 그려져 **이전 업체의 상세주소·계약금액**이 보인다(철칙 4).
async function clearAppCaches(){
  try{ if(window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } }catch(e){}
}
async function logout(){ await api('POST','/api/partner/logout'); await clearAppCaches(); location.href='/partner/login'; }

function stTag(s){
  //  ⚠⚠ [라운드644] '시공중'만 'blue'였다 — 형제(insurer_portal.html stTag,
  //    static/admin.js statusPill 둘 다 'green')와 갈라져 있었다. 같은
  //    사건을 시행사 포털에서 열면 파란 "시공중", 보험사 포털·운영 콘솔에서
  //    열면 초록 "시공중"으로 서로 다른 색이 떴다(caseDetail() 모달 헤더,
  //    360·395행 — 낙찰 뒤 가장 흔한 상태값이라 매번 재현된다). 취소·유찰을
  //    맞춘 아래 원칙(형제 stTag 와 매핑을 동기화)과 같은 이유로 초록에 맞춘다.
  const m={'입찰중':'blue','승인대기':'amber','시공중':'green','검수대기':'amber','완료보고지연':'red',
    '정산진행':'green','완료':'gray','접수':'gray','입금완료':'green','대기':'gray','이체완료':'green',
    '이체예약':'amber','승인':'green','재시공배정':'amber','확인중':'blue','반려':'gray',
    //  새 상태가 매핑에 없으면 전부 회색이 된다 — 취소·유찰은 구분돼야 한다
    '취소':'red','유찰':'amber','미수선종결':'gray'};
  return `<span class="tag ${m[s]||'gray'}">${esc(s)}</span>`;

function progBar(p){

let NOTIFS=[], BELL_OPEN=false, NOTI_SEEN=null;   // null = 아직 기준선 없음
async function loadNotifs(){
  try{
    const r=await api('GET','/api/partner/notifications');
    NOTIFS=r.notifications||[];
    const dot=document.getElementById('bdot');
    if(dot){ if(r.unread>0){ dot.textContent=r.unread>99?'99+':r.unread; dot.style.display='flex'; } else dot.style.display='none'; }
    if(BELL_OPEN) renderBell();
    // 새로 온 알림은 화면 우측 아래에 띄운다 — 벨은 눌러야 보이므로,
    // 다른 탭을 보고 있는 기사에게 출동 콜·낙찰이 스스로 알려야 한다.
    //  (첫 조회는 기준선만 잡고 아무것도 띄우지 않는다)
    if(window.Tray) NOTI_SEEN = Tray.feed(NOTIFS, NOTI_SEEN, n=>goNotif(n.id));
  }catch(e){}
  // 출동 콜은 선착순이라 늦게 알면 이미 다른 업체가 가져간다.
  // 알림을 볼 때 함께 갱신해, 탭 숫자가 실제 상황을 따라가게 한다.
  try{
    await loadDispatch();
    if(document.querySelector('.tab.on')?.dataset.v === 'dispatch') RENDER.dispatch();
  }catch(e){}
}

async function goNotif(id){

  try{ await api('POST','/api/partner/notifications/read',{id}); }catch(e){}
  BELL_OPEN=false; document.getElementById('bellPop').style.display='none';

// 서버가 낡아 API 가 404 인 상황과 화면 버그를 구분할 수 없었다.
function bootFail(e){
  var msg = (e && e.message) ? String(e.message) : String(e);
  var stale = /찾을 수 없|404|Not Found/i.test(msg);
  var w = document.getElementById('wrap');
  if(!w) return;
  w.innerHTML = '<div class="card" style="padding:20px">'
    + '<div style="font-weight:800;margin-bottom:8px">화면을 불러오지 못했습니다</div>'
    + '<div class="sub" style="line-height:1.6">' + esc(msg)
    + (stale ? '<br><br><b>서버가 예전 코드로 실행 중일 수 있습니다.</b> 서버를 다시 실행해 주세요.' : '')
    + '</div>'
    + '<div style="margin-top:14px"><a class="btn" href="">다시 시도</a></div>'
    + '</div>';
}
let _bootedOnce = false;   // [라운드203] 아래 참조
//  ⚠⚠ [라운드656] UPQ.setWho() 는 reload() 안(아래)에서만 불린다. 그런데
//    upqAutoFlush() 는 'online'·'visibilitychange' 전역 리스너(파일 하단)로
//    boot()/reload() 의 진행과 완전히 독립적으로도 불린다 — 페이지를 막 연
//    직후, reload() 가 setWho() 에 닿기 전(첫 네트워크 왕복이 끝나는 순간까지)
//    그 사이에 신호가 돌아오거나(이 기능이 정확히 노리는 상황 — "현장은
//    신호가 나쁘다") 화면을 켜면, UPQ.who 가 아직 null 이라 UPQ.all() 의
//    소유자 필터(upqueue.js)가 통째로 빠져 **같은 기기를 쓴 다른 업체가 못
//    올린 사진**까지 이 세션 자격증명으로 업로드를 시도하게 된다. 서버
//    (app.py api_partner_upload_photos)는 사건 소유자가 아니면 404 로 정확히
//    막지만, 아래 uploadPhotos() 의 RETRYABLE 목록엔 404 가 없어 "영구 거절"로
//    분류돼 UPQ.remove() 로 **남의 사진이 기기에서 영구 삭제**된다(재촬영이
//    안 되는 현장 사진 소실 — 이 파일 전체가 막으려는 바로 그 사고). boot()가
//    setWho() 를 결정(성공이든 org_id 없음이든 상관없이)하는 시점까지
//    upqAutoFlush() 자체를 미룬다.
let _upqIdentityReady = false;
async function boot(){
  try{
    const me = await api('GET','/api/partner/me');
    CSRF = me.csrf || '';
    document.getElementById('pname').textContent = me.name;
    document.getElementById('ptype').textContent = me.partner_type;
    if(me.is_owner){ const t=document.getElementById('tab-accounts'); if(t) t.style.display=''; }
    //  ⚠ 로그아웃 없이 계정이 바뀌었다면(탭만 닫았거나 401로 튕겼거나 정지
    //    당했거나) sw 캐시(URL만 열쇠, 계정 구분 없음 — 철칙 4)에 이전 업체
    //    사본이 남아 있을 수 있다. reload() 가 그걸 물어오기 전에 지운다.
    try{
      const lastId = localStorage.getItem('bokguon_partner_last_id');
      if(lastId && lastId !== String(me.id)) await clearAppCaches();
      localStorage.setItem('bokguon_partner_last_id', String(me.id));
    }catch(e){}
  }catch(e){ bootFail(e); return; }
  //  ⚠⚠ [라운드203] boot() 는 최초 로드(맨 아래) 말고도 reestimateGo()·coSend()
  //    가 "성공했으니 전체를 새로고침" 용도로 세션 중 다시 부른다 — 둘 다
  //    예외적 상황이 아니라 정상 업무(실사 증액 요청·변경견적 응답)다. 그런데
  //    아래 두 줄은 재진입 가드가 전혀 없어, 부를 때마다 .tab 클릭 리스너가
  //    또 하나씩 늘고 setInterval 도 또 하나씩 무장돼(이전 것 해제 안 함) —
  //    탭 클릭 한 번에 show() 가 여러 번, 30초 알림 폴링(선착순 출동 콜을
  //    가져오는 loadDispatch 포함)도 여러 겹으로 돈다. 세션이 길수록(현장
  //    기사가 하루 종일 켜 두는 화면) 계속 나빠진다 — 최초 1회만 무장한다.
  if(!_bootedOnce){
    _bootedOnce = true;
    document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>show(t.dataset.v)));
    setInterval(loadNotifs, 30000);   // 30초마다 새 알림 확인
  }
  await reload();
  show('home');
  loadNotifs();
}
async function reload(){
  D = await api('GET','/api/partner/dashboard');
  //  ★ 수수료 부가세 기준 — 이 값이 '받을 돈' 안내를 좌우한다.
  //    서버가 안 주면(구버전) 종전과 같은 '포함' 으로 둔다.
  if(typeof D.fee_vat_included === 'boolean') FEE_VAT_INCLUDED = D.fee_vat_included;
  offlineBanner(OFFLINE_COPY);
  await loadDispatch();   // 출동 콜은 놓치면 다른 업체가 가져간다 — 항상 함께 읽는다
  try{
    const ds = await api('GET','/api/partner/defects');
    const open = ds.filter(d=>d.status!=='완료'&&d.status!=='반려').length;
    const dn = document.getElementById('dn');
    if(open>0){ dn.textContent=open; dn.style.display='inline-block'; } else dn.style.display='none';
  }catch(e){}
  // 반려된 사진이 있으면 탭에 표시 — 재촬영이 필요한데 모르고 지나치면 정산이 밀린다
  const rej = (D.my_cases||[]).reduce((a,c)=>a+(c.rejected_count||0),0);
  const sn = document.getElementById('sn');
  if(sn){ if(rej>0){ sn.textContent=rej; sn.style.display='inline-block'; } else sn.style.display='none'; }
  // 투찰 가능한 재경매 건수를 탭 배지로 — 놓치면 라운드가 그냥 지나간다
  try{ await loadReauctions(); }catch(e){}
  syncAppbar();
  //  ⚠ 큐를 훑기 **전에** 내가 누구인지 알려 준다 — 안 하면 남의 업체가 못 올린
  //    사진이 내 배너에 뜨고, 내가 그걸 내 사건에 올리게 된다.
  if(window.UPQ && D.me && D.me.org_id != null) UPQ.setWho(D.me.org_id);
  _upqIdentityReady = true;   // [라운드656] 결과가 무엇이든 이제 결정은 끝났다
  //  못 올린 사진이 남아 있으면 어느 탭에 있든 보이게 한다
  try{ await upqBanner(); }catch(e){}
  //  그리고 **바로 한 번 조용히 올려 본다** — 신호가 돌아온 뒤 앱을 켠 경우다
  setTimeout(() => { upqAutoFlush().catch(()=>{}); }, 1500);
}

let CURTAB = 'home';        // 지금 보고 있는 탭 — 업로드 후 제자리로 돌아오기 위해 기억한다
function show(v){
  CURTAB = v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  //  ★ **탭바를 그 탭까지 끌어온다.**
  //    폰(375px)에서 탭 11개가 856px 라 뒤쪽 6개는 화면 밖에 있다. 종전에는
  //    활성 표시만 바꿔서, 하단 바로 '시공 현장·사진'이나 '정산'으로 넘어가면
  //    본문은 바뀌는데 탭바는 여전히 '홈·출동콜·입찰공고'를 보여 줬다 —
  //    기사는 지금 어디인지도, 돌아가는 길도 모른다.
  //    현장에서 제일 많이 쓰는 두 탭이 하필 화면 밖이다.
  try{
    const _cur = document.querySelector('.tab.on');
    if(_cur && _cur.scrollIntoView) _cur.scrollIntoView({block:'nearest', inline:'center'});
  }catch(e){}
  // 앱 하단 바도 같은 곳을 가리켜야 한다 — 지금 어디인지 모르면 길을 잃는다
  document.querySelectorAll('.appbar button').forEach(
    b=>b.classList.toggle('on', b.dataset.arg===v));
  RENDER[v]();
  window.scrollTo(0,0);
}
// 하단 바 배지 — 상단 탭 배지와 같은 숫자를 그대로 옮긴다(따로 세지 않는다)
function syncAppbar(){
  const pairs = [['dpn','ab-dp'], ['sn','ab-st']];
  for(const [from,to] of pairs){
    const a=document.getElementById(from), b=document.getElementById(to);
    if(!a||!b) continue;
    const n=(a.textContent||'').trim();
    if(n && a.style.display!=='none'){ b.textContent=n; b.style.display='flex'; }
    else b.style.display='none';
  }
}

// ══════════════════════════════════════════════════════════════
//  출동 콜 — 사진 없이 접수된 사건의 현장 수배
//
//  왜 이 화면이 중요한가 — 사진이 없으면 파손 규모를 몰라 경매를 열 수 없다.
//  그래서 인근 업체에게 동시에 알리고 **먼저 수락한 한 곳만** 현장에 보낸다.
//  먼저 가서 사진과 실견적을 올린 업체는 1차 협의가 성사되면 그대로 시공한다(출동 유인).
//
//  ⚠ 선착순이라 화면에도 그 사실이 분명히 보여야 한다.
//    "이미 다른 업체가 맡았습니다"가 뜨는 것은 오류가 아니라 정상 동작이다.
// ══════════════════════════════════════════════════════════════
let DISPATCHES = [];

async function loadDispatch(){
  try{
    const d = await api('GET','/api/partner/dispatches');
    DISPATCHES = d.items || [];
  }catch(e){
    //  ⚠ **비우지 않는다.** 통신이 끊겼다고 이미 받아 둔 출동 목록을 지우면
    //    기사는 '내가 맡은 건'과 주소를 화면에서 잃는다(캐시가 아직 없는
    //    첫 오프라인에서는 이 메모리 보존이 유일한 방어다).
  }
  // 수락 가능한 건이 있으면 탭에 숫자를 띄운다(놓치면 다른 업체가 가져간다)
  const open = DISPATCHES.filter(x=>x.can_claim).length;
  const b = document.getElementById('dpn');
  if(b){ b.textContent = open; b.style.display = open ? '' : 'none'; }
}

function dpLeft(due){
  if(!due) return '';
  //  ⚠ due_at 은 KST 문자열이다(dispatch.py 414·476). 오프셋을 안 붙이면
  //    폰의 타임존으로 읽혀, 서버는 이미 기한초과로 보는 건이 화면에는
  //    '540분 남음' 으로 뜬다. 같은 파일의 입찰 마감 계산 2곳은 붙이고 있었다.
  const t = Date.parse(String(due).replace(' ','T')+'+09:00') - Date.now();
  if(t <= 0) return '<span style="color:var(--red);font-weight:800">기한 지남</span>';
  const m = Math.floor(t/60000);
  return `<b style="color:${m<=10?'var(--red)':'var(--gold)'}">${m}분</b> 남음`;
}

//  거리를 **믿을 수 있는 만큼만** 말한다.
//   dist_exact = 사건·업체 좌표가 둘 다 실제 주소에서 온 경우.
//   아니면 시군구 중심 + 해시 지터라서 소수점은 전부 노이즈다 —
//   '약 0.2km' 로 보여 주면 기사가 그런 줄 알고 수락했다가 5km 를 이동한다.
function distText(d){
  const km = d.dist_km;
  if(km == null) return '';
  if(d.dist_exact) return `현장까지 약 ${km}km`;
  if(km < 10)  return '같은 지역 (정확한 거리는 주소를 확인하세요)';
  if(km < 40)  return `인근 지역 · 대략 ${Math.round(km/5)*5}km 안팎`;
  return `먼 지역 · 대략 ${Math.round(km/10)*10}km 안팎`;
}

          <label class="btn a sm upl">📷 현장 사진 찍기
            <input type="file" accept="image/*" capture="environment" multiple hidden
                   data-upload="${d.case_id}"></label>

            ${/*  ⚠⚠ [라운드116] 서버는 claim 도 거절과 같은 문턱(중간관리자 이상)으로

// ── 내가 맡은 출동 — 현장 미니 지도 ────────────────────────────
//  30분 안에 가야 하는데 주소만 글자로 보면 감이 안 온다. 지도로 방향을 잡게 한다.
//  ⚠ 목록을 다시 그릴 때마다 지도 인스턴스를 파기한다(사라진 DOM 을 붙들면 다음 렌더가 깨진다).
let DP_MAPS = [];
function dpDestroyMaps(){
  DP_MAPS.forEach(m=>{ try{ m.remove(); }catch(e){} });
  DP_MAPS = [];
}
function dpDrawMaps(){
  dpDestroyMaps();
  if(typeof L === 'undefined') return;
  document.querySelectorAll('.dpmap').forEach(el=>{
    const lat = parseFloat(el.dataset.lat), lng = parseFloat(el.dataset.lng);
    if(isNaN(lat) || isNaN(lng)) return;
    const map = L.map(el, {zoomControl:true, attributionControl:false}).setView([lat,lng], 14);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18}).addTo(map);
    L.circleMarker([lat,lng], {radius:11, weight:3, color:'#fff',
      fillColor:'#C0392B', fillOpacity:.95}).addTo(map)
      .bindPopup(`<div style="font-family:'Malgun Gothic',sans-serif">
        <b>🚩 ${esc(el.dataset.label||'현장')}</b><br>
        <span style="font-size:.76rem">${esc(el.dataset.addr||'')}</span></div>`);
    DP_MAPS.push(map);
    setTimeout(()=>{ try{ map.invalidateSize(); }catch(e){} }, 120);
  });
}

async function dpRefresh(){ await loadDispatch(); RENDER.dispatch(); }

async function dpClaim(id){
  try{
    const r = await api('POST','/api/partner/dispatches/'+id+'/claim',{});
    // 수락한 업체에게만 상세 주소가 열린다
    alert(`출동을 맡았습니다.\n\n접수번호 ${r.case_no}\n주소 ${r.address||'-'}\n공종 ${r.category||'-'}\n\n${r.message}`);
  }catch(e){
    // ⚠ "이미 다른 업체가 맡았습니다"는 오류가 아니라 선착순의 정상 결과다
    alert(e.message || '수락하지 못했습니다.');
  }
  await dpRefresh();
}

//  ⚠ 예전에는 확인도 결과도 없이 오류까지 삼켰다 — 눌렀는지조차 알 수 없었고,
//    잘못 눌러 거절해도 되돌릴 방법이 없다(선착순 콜은 다음 업체로 넘어간다).
async function dpDecline(id){
  const NL = String.fromCharCode(10);
  if(!confirm('이 출동 요청을 거절하시겠습니까?' + NL + NL +
              '거절하면 다음 업체에게 넘어가고, 이 건은 목록에서 사라집니다.')) return;
  try{
    await api('POST','/api/partner/dispatches/'+id+'/decline',{});
    toast('출동 요청을 거절했습니다.');
  }catch(e){
    toast(e.message || '거절 처리에 실패했습니다. 잠시 후 다시 시도해 주세요.');
  }
  await dpRefresh();
}

//  ⚠ 종전에는 맨몸 prompt() 로 받았다. 자릿수를 읽어 주지도, 다시 묻지도 않아
//    360만을 36만으로 치면 그대로 들어갔다. 게다가 **정정 경로가 없다** —
//    도착 보고는 한 번만 되고(status 가 '도착'으로 바뀌어 재보고가 막힌다),
//    이 값은 그대로 보험사 화면의 '현장 견적'이 되고 2차 경매 기준선이 된다.
//    금액 칸은 다른 곳(입찰)과 같은 방식으로 — 콤마·한글읽기·재확인.
async function dpArrive(id){
  openModal(`<h3>도착 보고 · 현장 실견적</h3>
    <div class="msub">현장에서 산출하신 시공 금액을 적어 주세요</div>
    <input id="dp_amt" inputmode="numeric" placeholder="예: 5,000,000"
           style="width:100%;margin-top:10px;font-size:1.15rem;font-weight:800;text-align:right">
    <div id="dp_ko" style="text-align:right;font-size:.82rem;color:var(--sub);
         min-height:1.2em;margin-top:4px"></div>
    <div class="notice" style="margin-top:12px">
      · 사진은 「시공 현장·사진」에서 <b>먼저</b> 올려 주세요.<br>
      · <b style="color:var(--red)">이 금액은 나중에 고칠 수 없습니다.</b>
        자릿수를 한 번 더 확인해 주세요.
    </div>
    <div class="modal-foot">
      <button class="btn g" data-act="closeModal">취소</button>
      <span style="flex:1"></span>
      <button class="btn a" data-act="dpArriveGo" data-arg="${id}">도착 보고</button>
    </div>`);
  const inp = document.getElementById('dp_amt');
  const ko = document.getElementById('dp_ko');
  if(inp){
    inp.addEventListener('input', () => {
      inp.value = comma(inp.value);
      ko.textContent = koRead(onlyDigits(inp.value));
    });

async function dpNoRepair(id){
  let reasons = [];
  try{ const d = await api('GET','/api/dispatch/no-repair-reasons'); reasons = d.reasons||[]; }catch(e){}
  if(!reasons.length){ alert('사유 목록을 불러오지 못했습니다.'); return; }
  const pick = prompt('미수선 사유를 번호로 고르세요.\n\n' +
    reasons.map((r,i)=>`${i+1}. ${r}`).join('\n'));
  if(pick===null) return;
  const idx = parseInt(pick,10)-1;
  if(!(idx>=0 && idx<reasons.length)){ alert('번호를 다시 확인해 주세요.'); return; }
  const reason = reasons[idx];
  const note = prompt(`사유: ${reason}\n\n현장 상황을 적어주세요` +
    (reason==='기타' ? ' (필수)' : ' (선택)')) || '';
  const by = prompt('확인한 담당자 이름을 적어주세요.') || '';
  try{
    const r = await api('POST','/api/partner/dispatches/'+id+'/no-repair',
                        {reason:reason, note:note, by:by});
    alert(r.message);
  }catch(e){ alert(e.message||'처리하지 못했습니다.'); }
  await dpRefresh();
}

// 금액을 한글로 읽어 준다 — 자릿수 실수를 눈으로 잡는 가장 확실한 방법.
function koRead(n){
  n = Number(n) || 0;
  if(!n) return '';
  const 억 = Math.floor(n/1e8), 만 = Math.floor((n%1e8)/1e4), 원 = n%1e4;
  return [억&&억+'억', 만&&만+'만', 원&&원].filter(Boolean).join(' ') + '원';
}
const onlyDigits = v => String(v||'').replace(/[^0-9]/g,'');

  //    사진 보기 버튼을 여기서 직접 이어 준다(안 하면 눌러도 조용하다).
  document.querySelectorAll('.modal [data-view]').forEach(b=>{
    b.addEventListener('click', () => loadPhotos(b.dataset.view));
  });
  const el = document.getElementById('b_amt');
  if(el){ el.addEventListener('wheel', ev=>ev.preventDefault(), {passive:false}); el.focus(); }
}

// 마감까지 남은 시간(시간 단위). 없으면 null.
function dlLeft(dl){
  if(!dl) return null;
  const t = Date.parse(String(dl).replace(' ','T')+'+09:00');
  if(isNaN(t)) return null;
  return (t - Date.now())/3600000;
}
function leftText(h){
  if(h <= 0) return '마감됨';
  //  ⚠⚠ **분을 먼저 반올림한 뒤 60 이면 시간으로 올린다.**
  //    `Math.round(...*60)` 은 60 을 만들 수 있어서, 그대로 찍으면
  //      h=0.9999 → '60분' · h=1.999 → '1시간 60분'
  //    이 된다. **두 분기가 같은 실수를 하고 있었다** — 처음에 아래 것만
  //    고쳤다가, 실제로 함수를 돌려 본 회귀 테스트가 위쪽을 잡아냈다.
  //    두 갈래를 하나로 합쳐 다시 갈리지 않게 한다.
  if(h < 48){
    let hh = Math.floor(h), mm = Math.round((h % 1) * 60);
    if(mm === 60){ hh += 1; mm = 0; }
    return hh ? (hh + '시간 ' + mm + '분') : (mm + '분');
  }
  return Math.floor(h/24)+'일';
}

// 입력할 때마다 판정을 다시 그린다 — 제출 버튼은 전부 통과해야 열린다.
function bidCalc(caseId){
  const c = D.open_cases.find(x=>x.id===caseId);
  if(!c) return;
  const el = document.getElementById('b_amt');
  if(!el) return;
  const raw = onlyDigits(el.value);
  const n = Number(raw) || 0;
  // 입력칸에는 쉼표를 유지한다(서버 parse_money 가 쉼표를 지우므로 그대로 보내도 된다).
  const pretty = comma(el.value);
  if(el.value !== pretty){ el.value = pretty; }
  document.getElementById('b_ko').textContent = koRead(n);

  const r2 = c.auction_round === 2;
  const cap = r2 ? 0 : (c.bid_cap ?? c.est_price ?? 0);
  const floor = r2 ? (c.bid_floor || c.est_price || 0) : 0;
  const mine = (D.my_bids||[]).find(b=>b.case_id===caseId);
  const rows = [];
  let ok = n > 0;

  if(!n){
    rows.push(`<div style="color:var(--muted)">입찰 총액을 적어 주세요.</div>`);
  } else if(n > 100e8){
    rows.push(`<div style="color:var(--red);font-weight:700">입찰가가 너무 큽니다. 숫자를 다시 확인해 주세요.</div>`);
    ok = false;
  } else {
    if(cap){
      const pct = (n*100/cap).toFixed(1);
      if(n > cap){
        rows.push(`<div style="color:var(--red);font-weight:700">이 공고의 입찰 상한은 ${won(cap)}원입니다.
          적으신 금액은 ${won(n)}원으로 <b>${won(n-cap)}원 많습니다.</b> 0이 하나 더 들어가지 않았는지 확인해 주세요.</div>`);
        ok = false;
      } else {
        rows.push(`<div style="color:var(--green)">가견적의 ${pct}% (${(100-pct).toFixed(1)}% 인하) · 상한 이하 ✓</div>`);
      }
      if(n > 0 && n < cap*0.5){
        rows.push(`<div style="color:var(--amber-text);font-weight:700">0을 하나 덜 넣지 않으셨는지 확인해 주세요 —
          가견적의 ${pct}%입니다.</div>`);
      }
    } else if(floor){
      // 2차 경매 — 하한만 있고 상한은 없다.
      if(n < floor){
        rows.push(`<div style="color:var(--red);font-weight:700">이 공고의 최소 금액은
          ${won(floor)}원입니다. 적으신 금액은 ${won(n)}원으로 <b>${won(floor-n)}원 모자랍니다.</b></div>`);
        ok = false;
      } else {
        const p2 = (n*100/floor).toFixed(1);
        rows.push(`<div style="color:var(--green)">최소 금액의 ${p2}% · 하한 이상 ✓</div>`);
      }
    }
    if(mine){
      if(n > mine.amount){
        rows.push(`<div style="color:var(--red);font-weight:700">이미 ${won(mine.amount)}원으로 입찰하셨습니다.
          다시 넣으실 때는 <b>이보다 낮은 금액만</b> 됩니다.</div>`);
        ok = false;
      } else if(n === mine.amount){
        rows.push(`<div style="color:var(--muted)">이미 넣으신 금액과 똑같습니다. 낮추실 경우에만 다시 제출해 주세요.</div>`);
        ok = false;
      } else {
        rows.push(`<div style="color:var(--green)">직전 ${won(mine.amount)}원보다 ${won(mine.amount-n)}원 낮음 ✓</div>`);
      }
    }
  }
  document.getElementById('b_judge').innerHTML = rows.join('');

  const pay = document.getElementById('b_payout');
  if(pay){
    pay.innerHTML = n
      ? `낙찰되면 보험사로부터 공사대금 <b>전액</b>을 직접 받고, 수수료 ${feePct(c.fee_rate_bp)}%${vatNote()}를 복구온에 별도 납부합니다 — 순수령액은 약 <b>${won(payoutOf(n, c.fee_rate_bp))}원</b>입니다.`
      : `금액을 적으시면 받으실 금액을 계산해 드립니다.`;
  }
  const go = document.getElementById('b_go');
  if(go) go.disabled = !ok;
}

//  ⚠ 2차 경매는 가견적이 **하한**이다(1차와 정반대).
//    그런데 빠른 감액이 늘 가견적을 기준으로 삼아, 「실견적 그대로」를 눌러도
//    실견적이 아니라 **하한가**가 채워졌다. 기사가 그대로 제출하면 실견적보다
//    수백만원 낮게 낙찰되고, 입찰은 되돌릴 수 없다.
//    회차에 따라 기준선을 바꾸고, 2차에서는 하한 아래로 내려가지 않게 막는다.
function bidCut(arg){
  const [cid, pct] = String(arg).split(':').map(Number);
  const c = D.open_cases.find(x=>x.id===cid);
  if(!c) return;
  const r2 = c.auction_round === 2;
  const base = r2 ? 0                                   // 2차 = 기준선 없음(아래 참조)
                  : (c.bid_cap ?? c.est_price ?? 0);    // 1차 = 입찰 상한(가견적)
  //  ⚠ 2차에는 '−N%' 퀵버튼을 두지 않는다. 예전에는 **남의 실견적**을 기준으로
  //    깎아 줬는데, 그건 그 업체의 원가선을 경쟁사에게 알려 주고 언더컷을 돕는 것이었다.
  //    2차의 구속 규칙은 하한뿐이고, 금액은 사진과 현장을 보고 스스로 정해야 한다.
  if(!base) return;
  const v = Math.floor(base * (100-pct) / 100);
  document.getElementById('b_amt').value = v.toLocaleString('ko-KR');
  bidCalc(cid);
}

// ── 확인 단계 — 같은 모달의 내용을 갈아끼운다 ─────────────────
function bidConfirm(caseId){
  const c = D.open_cases.find(x=>x.id===caseId);
  const n = Number(onlyDigits(document.getElementById('b_amt').value)) || 0;
  const days = Number(onlyDigits(document.getElementById('b_days').value)) || 0;
  if(!n) return;
  if(days < 0 || days > 365){ toast('공사에 걸리는 날짜는 0일에서 365일 사이로 적어 주세요.'); return; }
  //  ⚠ 회차에 따라 가견적의 의미가 뒤집힌다 — 1차는 상한, 2차는 하한.
  //    2차인데 '가견적 대비 −33%' 라고 말하면 정상 입찰을 실수로 오해하게 만든다.
  const r2c = c.auction_round === 2;
  const cap = r2c ? 0 : (c.bid_cap ?? c.est_price ?? 0);
  const floorC = r2c ? (c.bid_floor || c.est_price || 0) : 0;
  const mine = (D.my_bids||[]).find(b=>b.case_id===caseId);
  const left = dlLeft(c.deadline);
  //  ⚠ **2차에서는 이 방어가 통째로 꺼져 있었다.** cap 이 0 이라 `cap && …` 이
  //    늘 거짓이다. 정상적인 2차라면 서버 하한이 대신 막아 주지만, 가견적도
  //    개산 하단도 없는 건(사진 없이 접수 + 개산 패턴 미매칭)은 하한마저 0 이라
  //    상·하한 검사가 둘 다 건너뛰어진다. 게다가 그 조합에서는 저가경보까지
  //    꺼져(cap 기준) 운영팀 알림도 안 간다 — 0 하나 빠뜨린 금액이 무경고로
  //    확정되고, 이후에는 인하만 가능해 협력사가 스스로 못 빠져나온다.
  //  → 상한이 있으면 상한의 절반, 없으면 **하한 또는 직전 입찰가**를 기준으로 본다.
  const _base = cap || floorC || (mine ? mine.amount : 0);
  //  ⚠ [라운드78] 위 _base 는 cap 이 없으면 floorC·직전 입찰가까지 내려가는데,
  //    아래 경고 문구는 그 경우에도 여전히 cap 으로 나눴다 — 가견적도 하한도
  //    없는 사진없음 접수 건(cap=0)에서 suspicious 가 mine.amount 기준으로
  //    true 가 되면 `n*100/cap` 이 0으로 나눠 "Infinity%" 를 그대로 보여줬다.
  //    라벨도 실제 기준선에 맞게 같이 바꾼다.
  const _baseLabel = cap ? '가견적' : (floorC ? '최소 금액' : '직전 입찰가');
  const suspicious = _base ? (n < _base * 0.5) : false;   // 자릿수 의심 — 한 번 더 받는다

  openModal(`
    ${left!==null&&left<1 ? `<div style="background:#FDF3F3;color:#8A2B2B;font-weight:800;font-size:1rem;
        padding:10px 14px;border-radius:9px;margin-bottom:10px">곧 마감 — ${leftText(left)} 남음</div>`:''}
    <h3>${suspicious ? '0을 하나 덜 넣지 않으셨는지 확인해 주세요' : '이 금액으로 입찰하시겠습니까?'}</h3>
    <div class="msub">${esc(c.case_no)} · ${esc(c.category)} · ${esc(c.region||'')}</div>

    <div style="text-align:center;padding:18px;margin:12px 0;border-radius:12px;
                background:${suspicious?'var(--amber-bg)':'var(--mist)'}">
      <div style="font-size:1.8rem;font-weight:800;letter-spacing:-.02em">${won(n)}원</div>
      <div style="font-size:.95rem;font-weight:700;color:var(--blue);margin-top:3px">${koRead(n)}</div>
      ${suspicious?`<div style="font-size:.8rem;color:#7A5410;margin-top:6px;font-weight:700">
        ${_baseLabel} ${won(_base)}원의 ${(n*100/_base).toFixed(1)}% 입니다.</div>`:''}
    </div>

    ${suspicious ? `
      <div style="font-size:.8rem;color:var(--sub);line-height:1.7;margin-bottom:10px">
        입찰은 낮출 수만 있고 되돌릴 수 없습니다. 한 번 잘못 넣으면 이 금액 아래로만 움직일 수 있습니다.</div>
      <div class="field"><label>이 금액이 맞으면 아래에 한 번 더 적어 주세요</label>
        <input id="b_again" type="text" inputmode="numeric" autocomplete="off"
               style="font-size:1.1rem;font-weight:800;text-align:right" placeholder="원"></div>
    ` : `
      <div style="font-size:.82rem;line-height:1.9;color:var(--sub)">
        ${cap?`<div><b>가견적</b> ${won(cap)}원보다 ${won(cap-n)}원 낮음 (가견적의 ${(n*100/cap).toFixed(1)}%)</div>`:''}
        ${floorC?`<div><b>최소 금액</b> ${won(floorC)}원보다 ${won(n-floorC)}원 높음 (최소의 ${(n*100/floorC).toFixed(1)}%)</div>`:''}
        ${mine?`<div><b>직전 입찰</b> ${won(mine.amount)}원 → 이번 ${won(n)}원 (${won(mine.amount-n)}원 인하)</div>`:''}
        <div><b>공사 기간</b> <span style="${days?'':'color:var(--red);font-weight:700'}">${days}일${days?'':' (입력하지 않으셨습니다)'}</span></div>
        <div><b>받을 돈</b> 보험사 직접 송금 전액 중 순수령 약 ${won(payoutOf(n, c.fee_rate_bp))}원 (수수료 ${feePct(c.fee_rate_bp)}%${vatNote()}는 복구온에 별도 납부, 예정)</div>
        ${left!==null?`<div><b>마감까지</b> ${leftText(left)} 남음</div>`:''}
      </div>`}

    <div style="background:#FDF3F3;border:1px solid #F0C9C9;border-radius:10px;padding:11px 14px;
                font-size:.79rem;color:#8A2B2B;line-height:1.65;margin:12px 0">
      제출한 입찰은 <b>취소하거나 물릴 수 없습니다.</b>
      다시 넣을 때는 이보다 낮은 금액만 가능하며, 낙찰되면 이 금액이 곧 계약금액이 됩니다.
    </div>

    <label class="check" style="font-size:.82rem">
      <input type="checkbox" id="b_ack" data-act-change="bidAck">
      위 금액과 공사 기간으로 계약할 수 있음을 확인했습니다.</label>

    <div class="modal-foot">
      <button class="btn g" id="b_back" data-act="bidForm" data-arg="${caseId}">다시 확인</button>
      <span style="flex:1"></span>
      <button class="btn a" id="b_submit" data-act="submitBid" data-arg="${caseId}:${n}:${days}" disabled>이 금액으로 제출</button>
    </div>`);
  // 엔터 연타로 뚫리지 않게 기본 초점을 '다시 확인'에 둔다.
  const back = document.getElementById('b_back');
  if(back) back.focus();
}

function bidAck(){
  const ck = document.getElementById('b_ack');
  const btn = document.getElementById('b_submit');
  if(btn) btn.disabled = !(ck && ck.checked);
}

async function submitBid(arg){
  if(BID_LOCK) return;
  const [caseId, amount, days] = String(arg).split(':').map(Number);
  const c = D.open_cases.find(x=>x.id===caseId);
  const cap = c ? (c.est_price||0) : 0;
  // 자릿수 의심 구간이면 다시 적은 금액과 대조한다.
  const again = document.getElementById('b_again');
  if(again){
    const v = Number(onlyDigits(again.value)) || 0;
    if(v !== amount){ toast('두 금액이 서로 다릅니다. 넣으실 금액을 확인해 주세요.'); return; }
  }
  BID_LOCK = true;
  const btn = document.getElementById('b_submit');
  const back = document.getElementById('b_back');
  if(btn){ btn.disabled = true; btn.textContent = '제출 중…'; }
  if(back) back.disabled = true;
  try{
    const r = await api('POST','/api/partner/bids',{case_id:caseId, amount, days});
    closeModal();
    toast(`입찰 제출 완료 — 현재 <b>${r.bid_count}개사</b> 참여` + (r.warn?'<br>⚠ '+r.warn:''));
    await reload(); show('bids');
  }catch(e){
    // ⚠ 실패해도 모달을 닫지 않고 입력값을 지우지 않는다 — 다시 치게 만들면 그게 다음 실수다.
    const closed = /마감/.test(e.message||'');
    //  ★ **통신이 끊긴 것과 서버가 거절한 것은 다르다.** 'Failed to fetch' 를
    //    그대로 띄우면 기사는 그게 무슨 말인지 모른 채 '제출됐나?' 를 판단해야 한다.
    //    더 나쁜 것은 입찰가가 **인하만** 가능하다는 점이다 — 안 들어간 줄 알고
    //    같은 금액을 다시 넣으면 400 이 나서 '넣었는데 왜 안 되냐'가 된다.
    //    (같은 파일 submitComplete 는 이미 이렇게 갈라 놓았다)
    const netErr = /fetch|network|networkerror|failed to|load failed/i.test(e.message||'');
    toast(netErr
          ? '제출되지 않았습니다 — 통신이 끊겼습니다.<br>연결을 확인한 뒤 <b>같은 금액 그대로</b> 다시 제출해 주세요.'
          : e.message + (closed ? '<br>방금 마감되었습니다. 목록을 새로 불러옵니다.' : ''));
    if(closed){ closeModal(); await reload(); show('bids'); }
    else if(btn){ btn.disabled = false; btn.textContent = '이 금액으로 제출'; if(back) back.disabled = false; }
  }finally{
    BID_LOCK = false;
  }
}

    + '접수 후에는 스스로 취소할 수 없습니다. 금액이 맞습니까?')) return;
  try{
    await api('POST', `/api/cases/${caseId}/change-order`, {reason, requested_amount: amtRaw});
    closeModal();
    toast('실사 증액 요청을 접수했습니다. 관리자가 추가분 경매를 진행합니다.');

    //    사이 사건이 이미 종결되거나 다른 변경건이 생기면 실패 토스트만 뜨고
    //    낡은 입력폼이 남았다. 성공 분기와 같이 닫고 새로고침한다.
    toast(e.message); closeModal(); boot();

// 현장 사진 업로드 — 배치 전송 + 진행률 + 실패분만 재시도
//
//  ⚠ 예전에는 30장을 한 요청에 담아 한 번에 보냈다(최대 260MB). 현장 LTE 에서
//    이게 끊기면 **처음부터 다시** 올려야 했고, 진행 상황도 안 보여 기사는
//    멈춘 건지 되는 건지 알 수 없었다. 성공한 장수도 알 수 없어 중복 전송이 잦았다.
//  → ①보내기 전에 폰에서 줄여 데이터·시간을 아끼고 ②5장씩 나눠 순차 전송하며
//    ③몇 장째인지 보여 주고 ④실패한 묶음만 다시 올린다(성공분은 서버에 남는다).
const UP_BATCH = 5, UP_MAXN = 30, UP_MAXFILE = 8 * 1024 * 1024;
let UP_RETRY = null;      // 실패한 파일 목록 — '다시 올리기' 용
//  업로드가 도는 동안은 페이지를 떠나지 않게 잡는다. 현장 사진은 다시 못 찍는다.
let UP_BUSY = false;
window.addEventListener('beforeunload', function (e) {
  if (!UP_BUSY) return;
  e.preventDefault();
  e.returnValue = '사진을 올리는 중입니다. 지금 나가면 남은 사진이 올라가지 않습니다.';
  return e.returnValue;
});

// 큰 사진을 장변 1600px·JPEG 0.8 로 줄인다. 실패하면 원본을 그대로 쓴다.
async function shrinkImage(file){
  if(!/^image\/(jpe?g|png|webp)$/i.test(file.type)) return file;
  if(file.size < 900 * 1024) return file;              // 이미 작으면 그대로
  try{
    const bmp = await createImageBitmap(file);
    const max = 1600;
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if(scale >= 1){ bmp.close && bmp.close(); return file; }
    const cv = document.createElement('canvas');
    cv.width = Math.round(bmp.width * scale);
    cv.height = Math.round(bmp.height * scale);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    bmp.close && bmp.close();
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.8));
    if(!blob || blob.size >= file.size) return file;    // 안 줄었으면 원본
    return new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', {type:'image/jpeg'});
  }catch(e){ return file; }
}

function upProgress(html){
  let el = document.getElementById('upbar');
  if(!el){
    el = document.createElement('div');
    el.id = 'upbar';
    el.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);' +
      'background:var(--blue-ink);color:#fff;padding:12px 20px;border-radius:12px;z-index:210;' +
      'font-size:.84rem;font-weight:700;box-shadow:0 12px 30px rgba(0,20,45,.35);max-width:90vw';
    document.body.appendChild(el);
  }
  if(html === null){ el.remove(); return; }
  el.innerHTML = html;
}

//  ⚠ 사진 올리기 배선은 **문서 하나에만** 둔다.
//    예전에는 「시공 현장」 탭을 그릴 때만 리스너를 붙였다. 그래서 출동 수배 화면의
//    「📷 현장 사진 찍기」는 눌러 촬영까지 해도 아무 일도 안 일어났고,
//    사진이 없으면 도착 보고가 거부되므로(dispatch.arrive) **현장에 사람이 서 있는데
//    할 수 있는 게 없는** 완전 교착이었다. 화면이 늘 때마다 다시 빠지지 않도록
//    document 에서 한 번만 위임한다.
document.addEventListener('change', ev => {
  const inp = ev.target && ev.target.closest && ev.target.closest('[data-upload]');
  if (inp) uploadPhotos(inp.dataset.upload, inp);

//  retryQids: 재시도분이 기기 큐에 들어 있을 때 그 id 들. 성공한 만큼만 지운다.
async function uploadPhotos(caseId, input, retryFiles, retryQids){
  const src = retryFiles || Array.from((input && input.files) || []);
  if(!src.length) return;
  //  ⚠ **크기 판정은 줄인 뒤에 한다.** 요즘 폰은 한 장이 10~20MB 라
  //    원본 기준으로 자르면 고화질로 찍은 현장 사진이 큐에도 서버에도 안 남는다
  //    (아래 shrinkImage 가 어차피 크게 줄인다 — 줄인 뒤에도 넘칠 때만 뺀다).
  const ok = src.slice();
  if(!ok.length){ if(input) input.value=''; return; }
  if(ok.length > UP_MAXN){
    toast(`한 번에 ${UP_MAXN}장까지 올릴 수 있습니다. 나눠서 올려 주세요.`);
    if(input) input.value=''; return;
  }
  // 업로드 중에는 버튼을 잠근다 — 두 번 눌러 같은 사진이 두 번 올라가지 않게
  const btns = document.querySelectorAll('.upl');
  btns.forEach(b => b.style.pointerEvents = 'none');
  UP_BUSY = true;

  upProgress('사진 준비 중…');
  const files = [], tooBig = [];
  for(let i = 0; i < ok.length; i++){
    const shrunk = await shrinkImage(ok[i]);
    //  줄인 뒤에도 상한을 넘으면 그때 뺀다(서버가 어차피 거부한다).
    if(shrunk.size > UP_MAXFILE) tooBig.push(shrunk); else files.push(shrunk);
    upProgress(`사진 준비 중… ${i+1}/${ok.length}`);
  }
  if(tooBig.length) toast(`${tooBig.length}장이 줄인 뒤에도 8MB를 넘어 제외됩니다: ${esc(tooBig[0].name)}${tooBig.length>1?' 외':''}`);
  if(!files.length){ btns.forEach(b => b.style.pointerEvents = ''); UP_BUSY = false; upProgress(null); if(input) input.value=''; return; }

  //  ★ **보내기 전에 기기에 먼저 남긴다.**
  //    예전에는 전송 루프가 다 끝난 뒤에야 실패분을 IndexedDB 에 넣었다.
  //    그래서 30장을 올리는 몇 분 사이 폰이 잠기거나 세션 만료로 로그인 화면으로
  //    튕기면, 카메라에서 갓 찍은 사진이 **기기에도 서버에도 남지 않았다.**
  //    화면은 진행바만 사라져서 기사는 올라간 줄 알고 현장을 뜬다 —
  //    착공 전 사진은 다시 찍으러 갈 수 없다.
  //    이제 먼저 저장하고, 서버가 받은 것만 큐에서 지운다.
  const _c0 = (D.my_cases||[]).find(x=>x.id===Number(caseId));
  let qids = Array.isArray(retryQids) ? retryQids.slice() : [];
  if(window.UPQ && !retryFiles){        // 재시도분은 이미 큐에 있다
    try{ qids = await UPQ.put(Number(caseId), files, _c0 ? _c0.case_no : ''); }
    catch(e){ qids = []; }
  }

  let done = 0, failed = [], lastMsg = '', errs = [];
  for(let i = 0; i < files.length; i += UP_BATCH){
    const chunk = files.slice(i, i + UP_BATCH);
    const chunkIds = qids.slice(i, i + UP_BATCH);
    const fd = new FormData();
    for(const f of chunk) fd.append('photos', f);
    const pct = Math.round(done / files.length * 100);
    upProgress(`올리는 중… <b>${done}/${files.length}</b>장 (${pct}%)`);
    //  ★ 판정은 **HTTP 상태**로 한다. 메시지 문자열로는 401·429·5xx 를 구분할 수 없다
    //    (던지는 오류에 상태가 안 담긴다). 상태를 모르면 = 네트워크가 끊긴 것이므로 보존.
    let httpStatus = 0;
    try{
      const r = await fetch(`/api/partner/cases/${caseId}/photos`, {
        method:'POST', headers:{'X-CSRF-Token':CSRF}, credentials:'same-origin', body:fd
      });
      httpStatus = r.status;
      const d = await r.json().catch(()=>({}));
      if(!r.ok || !d.ok) throw new Error(d.error || '업로드에 실패했습니다.');
      // ⚠ 보낸 장수가 아니라 **서버가 실제로 저장한 장수**를 센다.
      //   서버는 파일별로 거를 수 있고(형식 오류·중복 등) 그때도 ok:true 를 준다.
      //   보낸 수로 세면 거절된 사진이 '올라갔다'로 찍히고, 기기에서도 지워져
      //   작업자는 올린 줄 알고 현장을 뜬다 — 다시 못 찍는 사진도 있다.
      //  ★ **어느 파일이 저장됐는지**를 이름으로 맞춘다.
      //    예전에는 '앞에서부터 N장 성공'으로 가정해 `chunk.slice(savedN)` 을 실패로 봤다.
      //    3장 중 2번째만 걸러진 경우, 성공한 3번째가 '실패'로 찍히고
      //    실패한 2번째의 큐 id 가 지워졌다 — 기기에도 서버에도 없는 사진이 생긴다.
      //    서버는 saved[].orig_name 으로 정확히 알려 준다.
      //  ⚠ **이름으로 맞추면 안 된다.** 휴대폰 카메라 캡처는 파일명이 매번 같아
      //    (iOS image.jpeg, 게다가 우리 쪽에서 .jpg 로 통일한다) 한 묶음에 동명이
      //    여러 장 들어온다. 한 장만 저장돼도 나머지까지 성공으로 읽혀 **큐에서
      //    지워졌다** — 다시 못 찍는 현장 사진이 그렇게 사라진다.
      //    이제 서버가 saved[].idx 로 '몇 번째 파일'인지 알려 준다. 이름은
      //    옛 응답용 폴백으로만 남긴다.
      const savedIdx = new Set(
        (Array.isArray(d.saved) ? d.saved : [])
          .map(x => x && x.idx).filter(x => x != null && x !== ''));
      const savedNames = new Set(
        (Array.isArray(d.saved) ? d.saved : []).map(x => x && x.orig_name).filter(Boolean));
      //  ⚠ **중복은 실패가 아니다.** 이미 서버에 같은 사진이 있다는 뜻이므로
      //    큐에서 지워야 한다. 안 그러면 재시도할 때마다 다시 '중복'이 되어
      //    큐가 영원히 비지 않고 배너가 사라지지 않는다.
      const dupN = Number(d.duplicates || 0);
      const okIdx = [];
      //  중복분 색인도 '서버가 받았다'로 친다(재시도해도 영원히 중복이라 큐가 안 빈다)
      (Array.isArray(d.duplicate_idx) ? d.duplicate_idx : [])
        .forEach(x => { if(x != null && x !== '') savedIdx.add(x); });
      chunk.forEach((f, j) => {
        if(savedIdx.size) { if(savedIdx.has(j)) okIdx.push(j); }
        else if(savedNames.size ? savedNames.has(f.name) : (j < (d.count || 0))) okIdx.push(j);
      });
      //  이름을 못 받은 옛 응답 대비 — 중복분만큼 앞에서부터 성공으로 인정한다
      if(!savedIdx.size && !savedNames.size && dupN){
        for(let j = okIdx.length; j < Math.min(chunk.length, (d.count||0) + dupN); j++) okIdx.push(j);
      }
      const okSet = new Set(okIdx);
      done += okIdx.length;
      chunk.forEach((f, j) => { if(!okSet.has(j)) failed.push(f); });
      //  ★ 서버가 받은 것(중복 포함)만 기기 큐에서 지운다.
      if(window.UPQ && chunkIds.length){
        const okIds = okIdx.map(j => chunkIds[j]).filter(x => x != null);
        if(okIds.length) UPQ.remove(okIds).catch(()=>{});
      }
      lastMsg = d.message || lastMsg;
      if(d.errors && d.errors.length) errs = errs.concat(d.errors);
    }catch(e){
      failed = failed.concat(chunk);
      errs.push(e.message || '전송 실패');
      //  ★ **영구 거절은 큐에서 뺀다.** 서버가 4xx 로 거절한 것(수배가 이미 실패로
      //    끝났다 · 사건이 종료됐다 · 사건 사진 상한 초과)은 **다시 보내도 같은 답**이다.
      //    종전에는 큐에 남겨 두고 자동 재전송이 계속 돌았고, 그 끝에서 무조건
      //    reload() 를 부르는 바람에 reload → 1.5초 뒤 autoFlush → 재전송 → reload …
      //    가 **약 2초 주기로 영원히** 돌았다(대시보드 6개 API 재조회 + 화면 강제 이동).
      //    사이트 데이터를 지우기 전에는 빠져나올 수 없었다.
      //  ⚠ **판정은 HTTP 상태로만 한다.** 메시지 문자열로 하면
      //    401(세션 만료)·403(CSRF 만료)·429(레이트리밋)·5xx(서버 일시 오류)가
      //    전부 '영구 거절'로 읽혀 **현장 사진이 기기에서 지워진다.**
      //    현장 사진은 다시 못 찍는다 — 큐가 마지막 보루다.
      //    아래 목록은 **나중에 다시 보내면 될 수도 있는** 상태다(보존).
      //      401·403 로그인/토큰 · 408 타임아웃 · 409 상태충돌 · 413 용량
      //      · 419/423/425 세션·잠금·too-early · 429 레이트리밋 · 5xx 서버
      //    상태가 0 이면 네트워크가 끊긴 것 — 당연히 보존한다.
      const RETRYABLE = [401, 403, 408, 409, 413, 419, 423, 425, 429];
      const permanent = httpStatus >= 400 && httpStatus < 500
                        && !RETRYABLE.includes(httpStatus);
      if(permanent && window.UPQ && chunkIds.length){
        UPQ.remove(chunkIds.filter(x => x != null)).catch(()=>{});
        errs.push(`올릴 수 없어 대기 목록에서 제외했습니다(오류 ${httpStatus}) — 필요하면 다시 촬영해 주세요.`);
      }
    }
  }
  btns.forEach(b => b.style.pointerEvents = '');
  UP_BUSY = false;
  upProgress(null);
  if(input) input.value = '';

  if(failed.length){
    // 성공분은 서버에 남아 있다 — 실패한 것만 다시 올린다
    //  ⚠ **큐 id 를 함께 넘긴다.** 예전에는 files 만 넘겨, 재시도가 성공해도
    //    upqFlush 와 달리 큐에서 지울 id 를 몰라 배너가 그대로 남았고
    //    같은 사진이 큐에 또 쌓였다(upqFlush 는 qids 를 제대로 넘긴다 — 여기만 빠졌다).
    const failIds = [];
    if(qids.length){
      const failSet = new Set(failed);
      files.forEach((f, j) => { if(failSet.has(f) && qids[j] != null) failIds.push(qids[j]); });
    }
    UP_RETRY = {caseId, files: failed, qids: failIds};
    //  실패분은 보통 **이미 큐에 있다**(보내기 전에 넣었고, 성공분만 지웠다).
    //  ⚠⚠ [라운드204] 예전엔 "retryFiles(재시도 호출)일 때만 큐에 없을 수
    //    있다"고 가정해 retryFiles && !qids.length 로만 다시 넣었다. 그런데
    //    최초 호출(!retryFiles)에서도 위 UPQ.put() 자체가 실패하면(트랜잭션
    //    abort 등) qids=[] 가 될 수 있다 — 그때 이 조건이 retryFiles 만 보고
    //    최초 호출을 걸러내 버려, 실패한 사진이 기기 큐에 전혀 안 들어간 채
    //    메모리(UP_RETRY)에만 남았다. 재시도 버튼을 누르기 전에 탭이 죽으면
    //    사진이 기기·서버 어디에도 없이 사라진다. retryFiles 여부와 무관하게
    //    "실패분 중 큐 id 가 하나도 확보 안 된 경우"면 항상 다시 채워 넣는다
    //    (이미 확보돼 있으면 failIds 가 채워져 있어 아래 조건이 걸리지 않는다
    //    — 중복 큐잉 아님).
    if(window.UPQ && !failIds.length){
      const _c = (D.my_cases||[]).find(x=>x.id===Number(caseId));
      UPQ.put(Number(caseId), failed, _c ? _c.case_no : '')
        .then(ids => { UP_RETRY = {caseId, files: failed, qids: ids || []}; })
        .catch(()=>{});
    }
    toast(`${done}장 성공 · <b>${failed.length}장 실패</b>` +
          (errs.length ? `<br>${esc(String(errs[0]).slice(0,50))}` : '') +
          `<br><a data-act="upRetry" style="color:var(--amber);font-weight:800;cursor:pointer">
             실패한 ${failed.length}장 다시 올리기</a>`);
  }else{
    UP_RETRY = null;
    toast(`${done}장 업로드 완료` + (errs.length ? `<br>⚠ ${esc(errs[0])}` : ''));
  }
  //  ⚠ 어디서 올렸든 '시공 현장'으로 튕기면, 출동 화면에서 올린 기사는
  //    사진이 올라갔는지도 모른 채 다른 탭에 서 있게 된다. 보던 화면으로 돌아온다.
  //  ★ 단, **자동 재전송(백그라운드)에서는 화면을 건드리지 않는다.**
  //    reload() 끝에 autoFlush 가 1.5초 뒤로 다시 예약되므로,
  //    여기서 reload 를 부르면 그 자체가 무한 고리의 한 마디가 된다.
  if(UPQ_AUTO_BUSY) return;
  await reload();
  show(CURTAB === 'dispatch' ? 'dispatch' : 'sites');
  if(CURTAB !== 'dispatch') loadPhotos(caseId);
}

async function upRetry(){
  if(!UP_RETRY) return;
  const {caseId, files, qids} = UP_RETRY;
  UP_RETRY = null;
  await uploadPhotos(caseId, null, files, qids);
  await upqBanner();
}

// ── 기기에 남은 '못 올린 사진'을 되살린다 ──────────────────────
//  앱을 다시 열었을 때 조용히 넘어가면 작업자는 올린 줄 안다. 눈에 띄게 남긴다.
async function upqBanner(){
  const box = document.getElementById('upqbar');
  if(!box || !window.UPQ) return 0;
  let groups = [];
  try{ groups = await UPQ.grouped(); }catch(e){ return 0; }
  const total = groups.reduce((a,g)=>a+g.items.length, 0);
  if(!total){ box.innerHTML=''; return 0; }
  box.innerHTML = `<div class="upqbar">
    <div class="ui">📵</div>
    <div class="ux"><b>아직 못 올린 사진 ${total}장</b>
      <small>${groups.map(g=>esc(g.caseNo||('사건 #'+g.caseId))+' '+g.items.length+'장').join(' · ')}
        — 통신이 끊겨 저장만 된 사진입니다. 지금 올려 주세요.</small></div>
    <button class="btn a sm" data-act="upqFlush">지금 올리기</button>
  </div>`;
  return total;
}

//  ★ **'자동으로 올라갑니다'를 실제로 지킨다.**
//    오프라인 배너는 "사진은 지금 찍어 두면 자동으로 올라갑니다"라고 약속하는데,
//    실제 배출 경로는 사람이 「지금 올리기」를 누르는 것 **하나뿐**이었다.
//    기사가 신호 되는 곳으로 나와도 아무 일이 일어나지 않았다.
//    신호가 돌아오는 순간 조용히 한 번 시도한다 — 화면(탭)은 옮기지 않는다.
let UPQ_AUTO_BUSY = false;
async function upqAutoFlush(){
  //  [라운드656] boot() 가 UPQ.setWho() 를 아직 못 정했으면(막 연 페이지의
  //  online/visibilitychange 가 reload() 보다 먼저 뛴 경우) 건너뛴다 — 위
  //  _upqIdentityReady 선언부 주석 참조. reload() 자신의 지연 실행(1.5초 뒤)이나
  //  다음 online/visibilitychange 이벤트가 대신 다시 부른다.
  if(UPQ_AUTO_BUSY || UP_BUSY || !window.UPQ || !_upqIdentityReady) return;
  if(navigator.onLine === false) return;
  let groups = [];
  try{ groups = await UPQ.grouped(); }catch(e){ return; }
  if(!groups.length) return;
  UPQ_AUTO_BUSY = true;
  try{
    for(const g of groups){
      UP_RETRY = { caseId: g.caseId,
                   files: g.items.map(i=>new File([i.blob], i.name, {type:i.blob.type||'image/jpeg'})),
                   qids: g.items.map(i=>i.id) };
      await upRetry();          // 실패하면 큐에 그대로 남는다(다음 기회에 다시)
    }
  }catch(e){ /* 조용히 — 배너가 남아 사람이 누를 수 있다 */ }
  finally{
    UPQ_AUTO_BUSY = false;
    try{ await upqBanner(); }catch(e){}
  }
}
window.addEventListener('online', () => { setTimeout(upqAutoFlush, 1200); });
//  화면을 다시 켜는 순간(주머니에서 꺼냈을 때)도 신호가 돌아와 있을 수 있다
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') setTimeout(upqAutoFlush, 1200);
});

// 큐에 남은 것을 사건별로 순서대로 올린다
async function upqFlush(){
  if(!window.UPQ) return;
  const groups = await UPQ.grouped();
  for(const g of groups){
    UP_RETRY = { caseId: g.caseId,
                 files: g.items.map(i=>new File([i.blob], i.name, {type:i.blob.type||'image/jpeg'})),
                 qids: g.items.map(i=>i.id) };
    await upRetry();
  }
  await reload();
  show('sites');
}

async function loadPhotos(caseId){
  const box = document.getElementById('ph-'+caseId);
  if(!box) return;
  if(box.dataset.open === '1'){ box.innerHTML=''; box.dataset.open='0'; return; }
  box.innerHTML = '<div class="sub" style="padding:10px">불러오는 중…</div>';
  try{
    const d = await api('GET', `/api/cases/${caseId}/photos`);
    box.dataset.open = '1';
    const group = (title, list, extra='') => !list.length ? '' : `
      <div class="pgroup">
        <div class="pgtitle">${title} <span class="sub">${list.length}장</span>${extra}</div>
        <div class="pgrid">${list.map(p=>`
          <figure class="pcell${p.review_status==='반려'?' rej':''}">
            <img src="${p.url}" alt="${esc(p.orig_name||'시공 사진')}">
            <figcaption>
              <span class="pk">${esc(KIND_LABEL[p.kind]||'미분류')}</span>
              ${p.ai_confidence ? `<span class="sub">AI ${p.ai_confidence}%</span>` : ''}
              ${p.review_status==='반려' ? `<span class="prej">반려: ${esc(p.reject_reason||'')}</span>` : ''}
            </figcaption>
          </figure>`).join('')}</div>
      </div>`;
    box.innerHTML =
      group('시공 사진', d.construction) +
      // ⚠ 영수증은 시공 사진과 분리해서 보여준다 (섞이면 공정 순서 확인이 어렵다)
      group('자재 영수증·서류', d.receipts, ' <span class="sub">— 시공 사진과 분리 보관</span>') +
      group('미분류', d.unclassified,
            d.ai_enabled ? '' : ' <span class="sub">— 담당자가 분류합니다</span>') +
      (d.total ? '' : '<div class="empty">아직 올린 사진이 없습니다</div>');
    //  썸네일로는 파손 정도를 알 수 없다 — 눌러서 키우고 넘겨 볼 수 있게 한다
    if(window.Lightbox) Lightbox.bind(box);
  }catch(e){ box.innerHTML = `<div class="sub" style="padding:10px;color:var(--red)">${esc(e.message)}</div>`; }
}

function reportComplete(caseId){
  const c = (D.my_cases||[]).find(x=>x.id===caseId) || {};
  const n = c.photo_count || 0, rej = c.rejected_count || 0;
  //  ⚠ 예전에는 confirm() 한 번에 memo:'' 를 보냈다. 서버는 memo 를 받아 감사로그에
  //    남기는데 **화면에 적을 곳이 없어 항상 비어 있었다.** 현장에서 남길 말
  //    (자재 변경·추가 작업·특이사항)이 어디에도 안 남는다.
  openModal(`
    <h3>시공 완료 보고</h3>
    <div class="msub">${esc(c.case_no||'')} · ${esc(c.category||'')} ${esc(c.region||'')}</div>

    ${rej ? `<div class="notice" style="border-left:3px solid var(--red)">
       <b>다시 찍을 사진 ${rej}장</b>이 남아 있습니다. 반려된 사진을 먼저 올리면
       검수가 한 번에 끝납니다(지금 보고해도 접수는 됩니다).</div>`
     : n ? `<div class="notice">올린 사진 <b>${n}장</b>으로 검수가 진행됩니다.</div>`

       그 시각이 <b>하자보증 기산점</b>이 됩니다. 현장을 떠난 뒤에는 사진을 다시 찍을 수 없습니다.<br>
       위 <b>사진 올리기</b>로 착공 전·시공 중·완료 사진을 먼저 올려 주세요.</div>`}

    <div class="field"><label>현장 특이사항 <small style="color:var(--faint);font-weight:400">— 선택</small></label>

    <div id="cp_err"></div>
    <div class="modal-foot">
      <button class="btn g" data-act="closeModal">취소</button>
      <span style="flex:1"></span>
      <button class="btn a" id="cp_go" data-act="submitComplete" data-arg="${caseId}"
        ${n ? '' : 'disabled title="사진을 먼저 올려 주세요" style="opacity:.45;cursor:not-allowed"'}>완료 보고 제출</button>
    </div>`);
}

async function submitComplete(caseId){
  const memo = (document.getElementById('cp_memo')?.value || '').trim().slice(0, 500);
  const btn = document.getElementById('cp_go');
  const err = document.getElementById('cp_err');
  if(btn){ btn.disabled = true; btn.textContent = '보고 중…'; }
  try{
    const r = await api('POST', `/api/partner/cases/${caseId}/complete`, {memo});
    closeModal();
    toast(r && r.warn
      ? ('완료 보고가 접수되었습니다. ' + r.warn)
      : '완료 보고가 접수되었습니다. 검수 결과를 기다려 주세요.');
    await reload(); show('sites');
  }catch(e){
    //  ⚠ 통신이 끊긴 것과 서버가 거절한 것은 다른 문제다. 예전에는 둘 다
    //    "Failed to fetch" 같은 원문이 토스트로 스쳐 지나가, 작업자가 보고된 줄 알고
    //    현장을 떴다. 실패는 화면에 **남겨** 다시 누르게 한다.
    const msg = String(e && e.message || e);
    const net = /fetch|network|networkerror|failed to/i.test(msg);
    if(err) err.innerHTML = `<div class="notice" style="border-left:3px solid var(--red)">
      <b>${net ? '보고되지 않았습니다 — 통신이 끊겼습니다.'
               : '보고되지 않았습니다.'}</b><br>
      ${net ? '신호가 잡히는 곳에서 <b>다시 제출</b>해 주세요. 창을 닫으면 보고는 되지 않습니다.'
            : esc(msg)}</div>`;
    if(btn){ btn.disabled = false; btn.textContent = '다시 제출'; }
  }
}

//  지적 1건 = [지적 사진 | 보수 사진] 한 쌍
function fixPairHTML(did, m){
  const fx = m.fixes || [];
  return `<div class="fixpair" id="fp-${m.id}" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;
       border:1px solid var(--mist);border-radius:12px;padding:10px;margin-bottom:10px">
    <figure class="pcell" style="outline:2.5px solid var(--red);margin:0">
      <img src="${esc(m.url)}" alt="지적 사진">
      <figcaption style="padding:7px 9px">
        <div style="font-size:.7rem;color:var(--faint)">지적</div>
        <div style="font-size:.78rem;font-weight:700;color:var(--red);line-height:1.5">
          ${m.note?esc(m.note):'(사유 미기재)'}</div></figcaption>
    </figure>
    <div id="fx-${m.id}">${fixSlotHTML(did, m.id, fx)}</div>
  </div>`;
}
function fixSlotHTML(did, pid, fx){
  if(fx && fx.length) return `<figure class="pcell fixed" style="outline:2.5px solid #1F8A55;margin:0">
      <img src="${esc(fx[0].url)}" alt="보수 사진">
      <figcaption style="padding:7px 9px">
        <div style="font-size:.7rem;color:var(--faint)">보수 완료</div>
        <div style="font-size:.75rem;color:var(--sub)">${esc((fx[0].created_at||'').slice(5,16))}</div>
        <label class="btn g sm upl" style="margin-top:6px;cursor:pointer">다시 찍기
          <input type="file" accept="image/*" capture="environment" hidden
                 data-fix="${did}" data-fixpid="${pid}"></label></figcaption></figure>`;
  return `<label class="btn a upl" style="display:grid;place-items:center;min-height:120px;
       border-radius:10px;cursor:pointer;text-align:center;line-height:1.6">
      📷 고친 자리<br>사진 올리기
      <input type="file" accept="image/*" capture="environment" hidden
             data-fix="${did}" data-fixpid="${pid}"></label>`;
}
function bindFixInputs(){
  document.querySelectorAll('input[data-fix]').forEach(inp=>{
    if(inp.dataset.bound) return;
    inp.dataset.bound = '1';
    inp.addEventListener('change', ()=>uploadFixPhoto(inp.dataset.fix, inp.dataset.fixpid, inp));
  });
  document.querySelectorAll('input[data-defadd]').forEach(inp=>{
    if(inp.dataset.bound) return;
    inp.dataset.bound = '1';
    inp.addEventListener('change', ()=>uploadDefectExtra(inp.dataset.defadd, inp));
  });
}

//  ⚠ 하자 사진은 시공 사진과 달리 **기기 큐(UPQ)를 타지 않는다.** 실패하면
//    input.value='' 로 File 참조가 사라져 그 자리에서 소멸했다. 기사가 현장을 뜨면
//    다시 못 찍는다. 큐를 하나 더 만드는 대신, 실패한 파일을 **메모리에 잡아 두고
//    '다시 올리기' 버튼**을 띄운다(같은 화면에 머무는 동안 확실히 살린다).
const FIX_RETRY = new Map();     // key → {fn, label}
function fixRetryHTML(key, label){
  return `<div class="empty" style="color:#8A2B2B">
    ⚠ ${esc(label)} 올리지 못했습니다 —
    <button class="btn xs" data-act="fixRetry" data-key="${esc(key)}">다시 올리기</button>
  </div>`;
}
ACT.fixRetry = function(el){
  const key = el.dataset.key, it = FIX_RETRY.get(key);
  if(!it){ toast('다시 선택해 주세요.'); return; }
  it.fn();
};

//  하자에 참고 사진 붙이기(지적별 짝이 아닌 것). fix_for 없이 올린다.
async function uploadDefectExtra(did, input){
  const files = [...(input.files||[])].filter(f=>f.size <= UP_MAXFILE);
  if(!files.length){ toast('올릴 사진이 없습니다(8MB 초과 제외).'); input.value=''; return; }
  const box = document.getElementById('dadd_'+did);
  if(box) box.textContent = '올리는 중…';
  try{
    const fd = new FormData();
    for(const f of files) fd.append('photos', await shrinkImage(f));
    const res = await fetch(`/api/defects/${did}/photos`, {
      method:'POST', headers:{'X-CSRF-Token':CSRF}, credentials:'same-origin', body:fd});
    const j = await res.json().catch(()=>({}));
    if(!res.ok || !j.ok) throw new Error(j.error || '업로드에 실패했습니다.');
    //  ⚠ 보낸 장수가 아니라 서버가 저장한 장수를 센다
    if(box) box.textContent = `사진 ${j.count||0}장 첨부됨`;
    toast(`참고 사진 ${j.count||0}장을 첨부했습니다.`);
  }catch(e){
    //  ★ 파일을 놓지 않는다 — 여기서 놓으면 다시 못 찍는 사진이 사라진다.
    const key = 'dx-' + did + '-' + Date.now();
    FIX_RETRY.set(key, {fn: () => uploadDefectExtraFiles(did, files, box)});
    if(box) box.innerHTML = fixRetryHTML(key, `참고 사진 ${files.length}장을`);
    toast(e.message + ' 사진은 아직 기기에 있습니다 — 「다시 올리기」를 눌러 주세요.');
  }
  input.value = '';
}

//  같은 파일 묶음으로 재시도한다(입력칸을 다시 고르지 않아도 되게)
async function uploadDefectExtraFiles(did, files, box){
  if(box) box.textContent = '올리는 중…';
  try{
    const fd = new FormData();
    for(const f of files) fd.append('photos', await shrinkImage(f));
    const res = await fetch(`/api/defects/${did}/photos`, {
      method:'POST', headers:{'X-CSRF-Token':CSRF}, credentials:'same-origin', body:fd});
    const j = await res.json().catch(()=>({}));
    if(!res.ok || !j.ok) throw new Error(j.error || '업로드에 실패했습니다.');
    if(box) box.textContent = `사진 ${j.count||0}장 첨부됨`;
    toast(`참고 사진 ${j.count||0}장을 첨부했습니다.`);
  }catch(e){
    const key = 'dx-' + did + '-' + Date.now();
    FIX_RETRY.set(key, {fn: () => uploadDefectExtraFiles(did, files, box)});
    if(box) box.innerHTML = fixRetryHTML(key, `참고 사진 ${files.length}장을`);
    toast(e.message);
  }
}
//  보수 사진 1장 업로드 — 지적 사진 번호(fix_for)를 함께 보내 짝을 만든다.
async function uploadFixPhoto(did, pid, input){
  const f = (input.files||[])[0];
  if(!f) return;
  if(f.size > UP_MAXFILE){ toast('사진이 8MB를 넘습니다.'); input.value=''; return; }
  input.value = '';
  await uploadFixPhotoFile(did, pid, f, document.getElementById('fx-'+pid));
}

//  실제 전송 — 재시도가 **같은 File 객체**를 다시 쓸 수 있게 분리했다.
async function uploadFixPhotoFile(did, pid, f, slot){
  slot = slot || document.getElementById('fx-'+pid);
  if(slot) slot.innerHTML = '<div class="empty">올리는 중…</div>';
  try{
    const fd = new FormData();
    fd.append('photos', await shrinkImage(f));
    fd.append('fix_for', pid);
    const res = await fetch(`/api/defects/${did}/photos`, {
      method:'POST', headers:{'X-CSRF-Token':CSRF}, credentials:'same-origin', body:fd});
    const j = await res.json().catch(()=>({}));
    if(!res.ok || !j.ok || !j.count) throw new Error(j.error || '업로드에 실패했습니다.');
    const url = `/api/photos/${j.saved[0].id}/file`;
    if(slot){ slot.innerHTML = fixSlotHTML(did, pid, [{url, created_at:''}]); bindFixInputs(); }
    toast('보수 사진을 올렸습니다.');
  }catch(e){
    //  ★ 파일을 놓지 않는다(종전에는 input.value='' 로 그대로 사라졌다)
    const key = 'fx-' + did + '-' + pid + '-' + Date.now();
    FIX_RETRY.set(key, {fn: () => uploadFixPhotoFile(did, pid, f, slot)});
    if(slot) slot.innerHTML = fixRetryHTML(key, '보수 사진을');
    toast(e.message + ' 사진은 아직 기기에 있습니다 — 「다시 올리기」를 눌러 주세요.');
  }
}
// 귀책 이의 — 판정을 자동으로 뒤집지 않는다. 사람이 다시 보게 하는 통로다.
function disputeForm(id){

  if(!d) return;
  document.getElementById('resbox').innerHTML = `
    <div class="panel" style="border:2px solid var(--amber)">

        이의 접수만으로 귀책이 바뀌지는 않으며, 운영팀이 사진·기록을 다시 확인해 연락드립니다.</div>

      <div style="display:flex;gap:10px">
        <button class="btn a" data-act="submitDispute" data-arg="${id}">이의 제출</button>

        ※ 검토 중에도 <b>재시공 일정은 그대로 진행</b>해 주세요. 기한 초과는 별도로 평점에 반영됩니다.</p>
    </div>`;

async function submitDispute(id){
  const r = document.getElementById('r_dis').value.trim();
  if(r.length < 10){ toast('이의 사유를 10자 이상 적어 주세요.'); return; }
  try{
    const res = await api('POST','/api/partner/defects/'+id+'/dispute',{reason:r});
    toast(res.message || '이의가 접수되었습니다');
    document.getElementById('resbox').innerHTML='';
    show('defects');
  }catch(e){ toast(e.message); }
}
async function submitResolve(id){
  const res = document.getElementById('r_res').value.trim();
  if(!res){ toast('조치 내용을 입력해 주세요.'); return; }
  //  지적받은 곳 중 보수 사진이 안 올라간 게 있으면 되묻는다.
  //  ⚠ 막지는 않는다 — 사진을 못 찍는 상황(야간·철거 후)이 있고, 막으면 보고가 교착된다.
  const pairs = document.querySelectorAll('#fixpairs .fixpair');
  const missing = [...pairs].filter(p=>!p.querySelector('figure.fixed')).length;
  if(missing){
    const NL = String.fromCharCode(10);
    if(!confirm(`지적 ${pairs.length}곳 중 ${missing}곳에 보수 사진이 없습니다.` + NL + NL +
                '사진이 없으면 보험사가 대조 확인을 못 해 재방문 요청이 올 수 있습니다.' + NL +
                '그래도 지금 제출할까요?')) return;
  }
  try{
    await api('POST','/api/partner/defects/'+id+'/resolve',{resolution:res});
    toast('재시공 완료 보고가 제출되었습니다 — 복구온 검수 후 보험사에 통보됩니다');
    document.getElementById('resbox').innerHTML='';
    show('defects');
  }catch(e){ toast(e.message); }
}

// ── 재경매 (변경 견적) ──────────────────────────────────────
//  실측·실견적 결과 공사범위가 커졌을 때 열리는 2단계 입찰.
//   · 추가분      : 늘어난 분량만 경쟁 → 최저가가 원 낙찰업체에 '원낙찰가+추가분'으로 제시
//   · 전체재경매  : 원업체가 그 제안을 거절 → 확대된 전체 범위를 나머지 업체까지 다시 경쟁
let REAU = [];
// 수수료율은 **보험사마다 다르다**(예: 공제조합 9%).
//  화면 곳곳에 "10%" 라고 박아 두었던 것을 사건별 실제 값으로 바꾼다 —
//  협력사가 받을 돈에 관한 숫자라 틀리면 안 된다.
const feePct = bp => ((bp === null || bp === undefined) ? 10 : bp / 100);
//  요율 뒤에 붙는 기준 표시. '포함' 이면 빈 문자열이라 화면이 종전과 같다.
const vatNote = () => FEE_VAT_INCLUDED ? '' : ' <span class="sub">(부가세 별도 — 세액만큼 더 공제)</span>';
//  ★ 수수료율이 **부가세 포함인지 별도인지**로 실수령액이 달라진다.
//    별도(공급가액 기준) 계약이면 서버는 수수료에 세액을 얹어 공제한다
//    (app.py compute_fee 의 vat_included=False 분기와 **같은 식**이어야 한다).
//    이걸 모른 채 포함 공식만 쓰면 화면이 실제보다 많이 받는다고 안내한다 —
//    500만원·10% 계약에서 5만원이 어긋난다. 투찰 직전에 보는 숫자다.
let FEE_VAT_INCLUDED = true;              // 대시보드 응답으로 갱신
const VAT_RATE = 10;
//  ⚠ 파이썬 round() 는 **정확히 .5 면 짝수로** 붙인다(사사오입이 아니다).
//    JS Math.round 는 무조건 올린다 — 공사대금 5,000,050원·10% 별도에서
//    서버 4,450,045 / 화면 4,450,044 로 1원이 어긋났다(대조 검증에서 잡혔다).
//    금액 화면은 서버와 **한 푼도 다르면 안 된다**.
const roundHalfEven = v => {
  const f = Math.floor(v);
  if(Math.abs(v - f - 0.5) > 1e-9) return Math.round(v);
  return (f % 2 === 0) ? f : f + 1;
};
const payoutOf = (amount, bp) => {
  const a = Number(amount) || 0;
  let fee = Math.floor(a * ((bp === null || bp === undefined) ? 1000 : bp) / 10000);
  if(!FEE_VAT_INCLUDED){ fee = Math.min(a, fee + roundHalfEven(fee * VAT_RATE / 100)); }
  return a - fee;
};

// 마감까지 남은 시간을 사람이 읽는 말로. 12시간 밑이면 눈에 띄게.
function dlText(dl){
  if(!dl) return '<span class="sub">-</span>';
  const t = Date.parse(String(dl).replace(' ','T')+'+09:00');
  if(isNaN(t)) return esc(String(dl).slice(5,16));
  const h = (t - Date.now())/3600000;
  const label = esc(String(dl).slice(5,16));
  if(h <= 0) return `<span style="color:var(--red);font-weight:700">마감됨</span>`;
  //  ⚠ [라운드74] 위 leftText 와 같은 결함(Math.round 가 59.5~60분을 '60분'으로
  //    반올림) — h 가 59.5~60분 구간이면 그대로 "60분"이 찍혔다(여기는 시간
  //    단위만 쓰므로 "1시간 60분" 조합은 없지만, "60분" 단독 오표시는 있다).
  //  ⚠⚠ [라운드545] h>=1 분기는 그 뒤로도 Math.round(h) 였다 — 형제 leftText 는
  //    시간 자릿수를 항상 Math.floor 로 내림해 "실제보다 많이 남았다고 말하지
  //    않는다"는 원칙을 지키는데(분 자릿수만 반올림, 최대 오차 30초), dpLeft
  //    (같은 파일, 분 단위 카운트다운)도 분을 통째로 내림해 아예 넘치지 않는다.
  //    이 분기만 시간 전체를 반올림해서, 실제 1시간30분(h=1.5) 남은 입찰
  //    마감을 "2시간 남음"으로 최대 약 30분까지 부풀려 보여줬다 — 시공사가
  //    여유가 있는 줄 알고 입찰을 미루다 마감을 놓칠 수 있는 방향(불리한 쪽이
  //    아니라 유리한 쪽으로 착시)이라 다른 카운트다운과 반대다. 새 정책 없이
  //    형제(leftText 의 Math.floor(h)) 관례를 그대로 이식한다.
  let left;
  if(h < 1){
    const mm = Math.round(h * 60);
    left = (mm >= 60 ? '1시간' : mm + '분');
  } else {
    left = Math.floor(h)+'시간';
  }
  const urgent = h < 12;
  return `${label}<br><span style="font-size:.68rem;font-weight:700;color:${urgent?'var(--red)':'var(--muted)'}">${left} 남음</span>`;
}

async function submitReBid(auctionId){
  const amount = document.getElementById('rb_amt').value;
  const days = document.getElementById('rb_days').value;
  if(!amount){ toast('입찰 총액을 입력해 주세요.'); return; }
  const r = REAU.find(x=>x.auction_id===auctionId);
  if(r && r.cap && Number(amount) > r.cap){
    toast(`입찰가는 상한 <b>${won(r.cap)}원</b>을 초과할 수 없습니다.`); return;
  }
  //  ⚠ [라운드79] 1차 경매(bidConfirm)의 자릿수 방어는 가견적/직전 입찰 대비
  //    상대 기준(× 0.5)인데, 여기는 절대값(10만원 미만)이었다 — 재경매 상한은
  //    보통 수백만~수천만원이라 "0 하나 빠뜨린" 금액 대부분이 10만원을 그냥
  //    넘어 이 방어를 통과했다. 서버는 인하만 허용하므로 그 금액이 영구 확정된다
  //    (철회 경로 없음). 1차와 같은 상대 기준으로 맞춘다.
  const NL = String.fromCharCode(10);
  const _n = Number(amount);
  const _base = r ? (r.cap || r.my_bid || 0) : 0;
  const odd = (_base && _n < _base * 0.5)
    ? (NL + `⚠ ${r.cap?'상한':'직전 입찰'} ${won(_base)}원의 ${(_n*100/_base).toFixed(1)}%입니다`
           + ' — 0을 빠뜨리지 않으셨나요?')
    : '';
  if(!confirm('재경매 입찰' + NL + NL
              + '금액: ' + _n.toLocaleString('ko-KR') + '원'
              + (days ? (NL + '공기: ' + days + '일') : '') + NL + NL
              + '제출 후에는 **인하만** 가능하며 철회할 수 없습니다. 이 금액이 맞습니까?' + odd)) return;
  try{
    const res = await api('POST','/api/partner/reauction-bids',{auction_id:auctionId, amount, days});
    //  ⚠ '현재 최저가입니다' 를 뺐다 — 인하 재투찰을 반복하면 그 표시가 뒤집히는
    //    지점에서 경쟁사 입찰액이 특정된다(경쟁 입찰가 비공개 철칙).
    toast(`${esc(res.kind)} 입찰 완료 — 현재 <b>${res.bid_count}개사</b> 참여`);
    document.getElementById('rebidbox').innerHTML='';
    await RENDER.reauction();
  }catch(e){ toast(e.message); }
}

          <td>${s.status==='활성'?'<span class="tag green">활성</span>':'<span class="tag gray">정지</span>'}</td>
          <td>${esc((s.created_at||'').slice(0,10))}</td>
          <td class="r">
            <button class="btn g sm" data-act="subReset" data-arg="${s.id}">비번재발급</button>
            <button class="btn g sm" data-act="subToggle" data-arg="${s.id}" data-st="${esc(s.status)}">${s.status==='활성'?'정지':'활성화'}</button>
            <button class="btn g sm" data-act="subDel" data-arg="${s.id}">삭제</button>
          </td></tr>`).join(''):'<tr><td colspan="6" class="empty">발급된 계정이 없습니다</td></tr>'}
      </table></div>
    </div>`;
};
function subCredModal(title, r){
  openModal(`<h3>${title}</h3><div class="msub">임시 비밀번호는 지금 한 번만 표시됩니다.</div>
    <div class="dgrid" style="grid-template-columns:1fr">
      <div class="di"><span class="l">아이디</span><span class="v">${esc(r.login_id)}</span></div>
      <div class="di"><span class="l">임시 비밀번호</span><span class="v" style="font-family:monospace;font-size:1rem">${esc(r.temp_password)}</span></div>
      ${r.role?`<div class="di"><span class="l">등급</span><span class="v">${esc(r.role)}</span></div>`:''}
    </div>
    <div class="dnote">${esc(r.note||'담당자에게 안전하게 전달하고, 첫 로그인 시 비밀번호를 변경하도록 안내해 주세요.')}</div>
    <div class="modal-foot"><span style="flex:1"></span><button class="btn g" data-act="closeModal">닫기</button></div>`);
}
async function subCreate(){
  const login_id=(document.getElementById('sa_id').value||'').trim();
  const name=(document.getElementById('sa_name').value||'').trim();
  const role=document.getElementById('sa_role').value;
  try{ const r=await api('POST','/api/partner/subaccounts',{login_id,name,role}); subCredModal('계정 발급 완료', r); await RENDER.accounts(); }
  catch(e){ toast(e.message); }
}
async function subReset(id){
  if(!confirm('이 계정의 비밀번호를 재발급하시겠습니까?')) return;
  try{ const r=await api('POST','/api/partner/subaccounts/'+id+'/reset-pw'); subCredModal('비밀번호 재발급', r); }
  catch(e){ toast(e.message); }
}
async function subToggle(id, el){
  const next=(el&&el.getAttribute('data-st'))==='활성'?'정지':'활성';
  try{ await api('PATCH','/api/partner/subaccounts/'+id,{status:next}); toast('상태를 변경했습니다.'); await RENDER.accounts(); }
  catch(e){ toast(e.message); }
}
async function subDel(id){
  if(!confirm('이 계정을 삭제하시겠습니까? 되돌릴 수 없습니다.')) return;
  try{ await api('DELETE','/api/partner/subaccounts/'+id); toast('삭제했습니다.'); await RENDER.accounts(); }
  catch(e){ toast(e.message); }
}

boot();


// ── 인라인 핸들러 대체 (CSP nonce 전환) ──────────────────────
//  data-act="이름" 으로 적힌 동작을 실제 함수에 연결한다.
//  ⚠ 즉시실행 함수로 감싼다 — 클래식 스크립트들이 전역 렉시컬 스코프를 공유하므로
//    최상위에서 const ACT 를 선언하면 다른 스크립트와 중복 선언 충돌이 나고,
//    그 스크립트가 통째로 실행되지 않는다(화면이 "불러오는 중…" 에서 멈춘다).
(function () {
  window.ACT = window.ACT || {};
  var ACT = window.ACT;
  // data 속성은 항상 문자열이라, 숫자를 받던 함수가 깨지지 않도록 되돌린다
  var _n = function (v) { return (v !== null && v !== "" && !isNaN(v)) ? Number(v) : v; };
  ACT.bidForm = (a, el, ev, b) => bidForm(_n(a), _n(b), el, ev);
  ACT.upRetry = () => upRetry();          // 실패한 사진만 다시 올리기
  ACT.reBidForm = (a, el, ev, b) => reBidForm(_n(a));
  ACT.submitReBid = (a, el, ev, b) => submitReBid(_n(a));
  ACT.clearBox = (a) => { const b = document.getElementById(a); if (b) b.innerHTML = ''; };
  ACT.logout = (a, el, ev, b) => logout(_n(a), _n(b), el, ev);
  ACT.resolveForm = (a, el, ev, b) => resolveForm(_n(a), _n(b), el, ev);
  // ⚠ submitBid 의 인자는 "사건:금액:공기" 형태의 문자열이다(숫자로 바꾸면 안 된다).
  ACT.submitBid = (a) => submitBid(a);
  // ⚠ 라이브 타이핑 입력은 첫 인자가 입력값이고, caseId 는 **4번째(data-arg)**로 온다.
  ACT.bidCalc = (v, el, ev, arg) => bidCalc(_n(arg));
  // 출동 콜 — 선착순 수배
  ACT.dpRefresh  = () => dpRefresh();
  ACT.dpClaim    = (a) => dpClaim(_n(a));
  ACT.dpDecline  = (a) => dpDecline(_n(a));
  ACT.dpArrive   = (a) => dpArrive(_n(a));
  ACT.dpNoRepair = (a) => dpNoRepair(_n(a));
  ACT.bidCut = (a) => bidCut(a);
  ACT.bidConfirm = (a) => bidConfirm(_n(a));
  ACT.bidAck = () => bidAck();
  ACT.submitResolve = (a, el, ev, b) => submitResolve(_n(a), _n(b), el, ev);
  // 탭 이동 — 홈 카드·할 일 패널·앱 하단바가 전부 이걸 쓴다.
  //  ⚠ 협력사 포털에만 이게 빠져 있어서, 카드를 눌러도 아무 일도 일어나지 않았다.
  //    (탭 이름은 문자열이다 — _n() 로 숫자 변환하면 안 된다)
  ACT.show = (a) => show(a);
  ACT.upqFlush = () => upqFlush();       // 기기에 남은 사진 일괄 재업로드
  ACT.submitComplete = (a) => submitComplete(_n(a));
  ACT.reestimateGo = (a) => reestimateGo(_n(a));
  ACT.disputeForm = (a) => disputeForm(_n(a));       // 하자 귀책 이의
  ACT.defectPhotos = (a) => defectPhotos(_n(a));     // 보험사가 지적한 사진·사유
  ACT.submitDispute = (a) => submitDispute(_n(a));
  ACT.caseDetail = (a, el, ev, b) => caseDetail(_n(a), _n(b), el, ev);
  ACT.subCreate = () => subCreate();
  ACT.subReset = (a, el, ev, b) => subReset(_n(a));
  ACT.subToggle = (a, el, ev, b) => subToggle(_n(a), el);
  ACT.subDel = (a, el, ev, b) => subDel(_n(a));
  ACT.closeModal = () => closeModal();
  ACT.modalBackdrop = (a, el, ev) => { if (ev.target === el) closeModal(); };
  ACT.toggleBell = (a, el, ev) => { ev.stopPropagation(); toggleBell(); };
  ACT.readAll = (a, el, ev) => { ev.stopPropagation(); readAll(); };
  ACT.goNotif = (a, el, ev, b) => goNotif(_n(a), _n(b), el, ev);
})();

</script>
