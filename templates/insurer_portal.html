<script nonce="{{ csp_nonce }}">
let D=null, CSRF='', SELBID=null;
const won = n => (n||0).toLocaleString('ko-KR');
//  ⚠⚠ [라운드168] '(작은따옴표) 누락 — form.js 가 window.esc 에 심어 둔 더
//    강한 판을 이 const 선언이 가린다(같은 이름 재선언은 전역 렉시컬 스코프에서
//    window 속성보다 우선한다). 형제 판(addrpick.js 등)과 맞춘다.
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
//  ⚠⚠ [라운드668] round667이 정산 명세서 기본값 수정에서 todayKST()를 불렀지만
//    이 파일엔 그 함수 자체가 정의돼 있지 않았다(admin.js·partner_portal.html
//    형제 판만 있고, 이 파일은 그 어느 것도 <script src=...>로 안 가져온다) —
//    RENDER.settle()·ACT.insStmtExport()를 실제로 부르는 순간(정산 탭을 열거나
//    엑셀 버튼을 누르는 순간) ReferenceError로 그대로 깨졌다(실측: Node로 실제
//    렌더된 스크립트를 그대로 실행해 재현). 형제 판과 완전히 같은 정의를 그대로
//    옮긴다 — toISOString()은 UTC 기준이라 KST 00:00~09:00 사이엔 전날 날짜를
//    돌려주는데, 서버는 전부 KST로 저장하므로 화면도 KST로 맞춰야 한다.
const todayKST = () => new Date(Date.now() + 9*3600*1000).toISOString().slice(0,10);
// ── 입찰 마감 잔여시간 (협력사 포털과 같은 계산 — 마감 문자열은 KST) ──
//  '입찰중' 줄만 보고는 언제 승인 건이 올지 알 수 없어 담당자가 포털을 계속 새로고침한다.
function dlLeft(dl){
  if(!dl) return null;
  const t = Date.parse(String(dl).replace(' ','T')+'+09:00');
  if(isNaN(t)) return null;
  return (t - Date.now())/3600000;
}
function leftText(h){
  if(h <= 0) return '마감됨';
  //  ⚠⚠ [라운드74] partner_portal.html 의 leftText 는 이미 이 결함을 고쳤는데
  //    (Math.round 가 분을 60 으로 반올림해 '60분'·'N시간 60분'이 찍히는 문제),
  //    같은 이름·같은 목적의 이 사본은 고쳐지지 않은 채 남아 있었다 — 사본이
  //    둘이라 한쪽만 고치면 다시 갈라진다. 같은 로직으로 맞춘다.
  if(h < 48){
    let hh = Math.floor(h), mm = Math.round((h % 1) * 60);
    if(mm === 60){ hh += 1; mm = 0; }
    return hh ? (hh + '시간 ' + mm + '분') : (mm + '분');
  }
  return Math.floor(h/24)+'일';
}
// 목록 셀 — 마감 임박(12시간 미만)은 붉게. 입찰중이 아니면 마감 표시가 의미 없다.
//  사진 없이 접수된 건은 아직 경매가 아니라 '출동 콜' 단계이므로 그 진행을 보여준다.
function dlCell(c){
  if(c.intake_type==='사진없음' && c.status==='접수') return dpCell(c);
  if(c.status!=='입찰중' || !c.deadline) return '<span style="color:var(--faint)">-</span>';
  const h = dlLeft(c.deadline);
  const urgent = h!==null && h < 12;
  const cnt = (c.bid_count!=null) ? `<div style="color:var(--faint);font-size:.66rem">입찰 ${c.bid_count}건</div>` : '';
  return `<div style="font-size:.72rem;${urgent?'color:var(--red);font-weight:800':''}">`
    + esc(String(c.deadline).slice(5,16))
    + (h!==null?`<div style="font-size:.66rem">${leftText(h)} 남음</div>`:'')
    + `</div>${cnt}`;
}

//  ⚠⚠ [라운드76] 업로드가 도는 동안은 페이지를 떠나지 않게 잡는다 — 사고 현장
//    사진은 다시 못 찍는다. partner_portal.html 은 이미 이 잠금(UP_BUSY)이 있는데
//    보험사 화면만 없었다 — 30초 알림 폴링(loadNotifs)이 api() 를 거치므로,
//    담당자가 사진을 올리는 도중 세션이 만료되면 그 폴링이 401 을 만나 곧바로
//    로그인 화면으로 튕겼고, 그 강제 이동이 진행 중이던 FormData 업로드를

//    오류를 볼 수도 없었다).
let UP_BUSY = false;
window.addEventListener('beforeunload', function (e) {
  if (!UP_BUSY) return;
  e.preventDefault();
  e.returnValue = '사진을 올리는 중입니다. 지금 나가면 사진이 올라가지 않습니다.';
});
async function api(method,url,body){
  const headers={'Content-Type':'application/json'};
  if(method!=='GET'&&CSRF) headers['X-CSRF-Token']=CSRF;
  const opt={method,headers,credentials:'same-origin'};
  if(body) opt.body=JSON.stringify(body);
  const r=await fetch(url,opt);
  // 세션이 만료되면 CSRF 토큰도 함께 무효가 되어 403 이 먼저 떨어진다.
  // 403 을 그냥 오류로 처리하면 사용자는 로그인 화면으로 가지 못하고 갇힌다.
  //  ⚠ [라운드76] 업로드 중(UP_BUSY)이면 강제 이동을 미룬다 — partner_portal.html
  //    api() 와 같은 이유·같은 방식.
  if(r.status===401){
    if(UP_BUSY){ throw new Error('auth-deferred'); }
    location.href='/insurer/login'; throw new Error('auth');
  }
  //  ★ **403 은 두 가지다** — '세션이 끊겼다'와 '이 계정은 그 일을 할 수 없다'.
  //    둘을 뭉쳐 로그인 화면으로 보내면, 서버가 정확히 적어 보낸 사유
  //    ("이 작업은 중간관리자 이상만…")가 통째로 버려지고 사용자는
  //    재로그인 → 같은 버튼 → 또 튕김 을 반복한다(계정 장애로 오인해 신고한다).
  if(r.status===403){
    const d0 = await r.json().catch(()=>({}));
    if(d0.code==='FORBIDDEN' || d0.code==='PORTAL_FORBIDDEN'){
      throw new Error(d0.error || '이 계정에는 권한이 없습니다.');
    }
    if(UP_BUSY){ throw new Error('auth-deferred'); }
    location.href='/insurer/login'; throw new Error('auth');
  }
  //  ⚠ 서버가 오류번호(ref)를 붙여 보내는데 본문을 읽기도 전에 버리면,
  //    문의를 받아도 로그에서 그 요청을 찾을 방법이 없다. 번호만 함께 보여 준다.
  if(r.status>=500){
    const d5 = await r.json().catch(()=>({}));
    throw new Error('서버에 일시적인 문제가 있습니다. 잠시 후 다시 시도해 주세요.'
                    + (d5 && d5.ref ? ` (오류번호 ${d5.ref})` : ''));
  }
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||'요청 실패');
  return d;
}
//  ⚠ 로그아웃하면 **서비스워커 사본까지** 지운다.
//    sw 는 대시보드 응답을 URL 만 열쇠로 캐시한다 — 계정 구분이 없다.
//    다른 협력사 계정으로 갈아탄 직후 네트워크가 잠깐 끊기면 그 사본이

function stTag(s){
  const m={'입찰중':'blue','승인대기':'amber','시공중':'green','검수대기':'amber','완료보고지연':'red',
    '정산진행':'green','완료':'gray','접수':'gray','입금완료':'green','대기':'gray','이체완료':'green',
    //  ⚠⚠ [라운드672] 정산(settlements)의 transfer_status·review_status 값인
    //    '이체예약'·'승인'이 이 매핑에 아예 없었다 — 형제(partner_portal.html
    //    stTag)는 이미 갖고 있다(round75가 세운 "형제 stTag 동기화" 원칙,
    //    round644가 '시공중' 하나를 마저 맞췄던 바로 그 두 매핑인데 그때도
    //    전체 키를 대조하진 않았다). 이 파일은 sett.transfer_status(963·964행
    //    "업체 지급", 1639행 목록)·sett.review_status(965행 "지급 검수")를
    //    그대로 stTag()에 넘기는데, 두 키가 없어 "매핑에 없으면 회색"이라는
    //    기본값으로 떨어졌다 — 실측(운영 DB 읽기전용 조회): review_status=
    //    '승인'인 정산이 지금 21/43건이라 사건 상세를 열 때마다 절반 가까이
    //    "지급 검수: 승인"이 "대기"와 똑같은 회색으로 보인다. transfer_status=
    //    '이체예약'은 지금 스냅샷엔 없지만 app.py(정산 검수 승인 — review_status
    //    ='승인'과 같은 UPDATE 문에서 함께 찍힌다)가 실제로 만드는 값이라
    //    언제든 재현된다. 형제 매핑과 같은 색으로 맞춘다.
    '이체예약':'amber','승인':'green',
    '재시공배정':'amber','확인중':'blue','반려':'gray',

    //    "매핑에 없으면 회색이니 취소·유찰은 구분돼야 한다"며 red 로 고쳐 놨다.
    //    사건 취소(app.py: UPDATE cases SET status='취소')가 이 함수를 그대로
    //    거치는데(사건 목록·상세), 회색이면 완료·접수 같은 평범한 상태와

    '모집중':'amber','수배됨':'blue','도착':'green','실패':'red','취소':'red',
    '수배중':'amber','사진확보':'green','수배실패':'red','미수선종결':'gray',

function dpCell(c){
  if(c.intake_type!=='사진없음') return '';
  const d=c.dispatch;
  if(!d) return '<span class="tag amber">수배 준비</span>';
  const bits=[stTag(d.status)];
  if(d.claimed_name) bits.push(`<div style="font-size:.66rem;color:var(--sub)">${esc(d.claimed_name)}</div>`);
  if(d.status==='수배됨'&&d.due_at){
    const h=dlLeft(d.due_at);
    bits.push(`<div style="font-size:.66rem;${h!==null&&h<=0?'color:var(--red);font-weight:800':''}">`
      +(h!==null?(h<=0?'도착 기한 초과':leftText(h)+' 내 도착'):'')+`</div>`);
  }
  if(d.arrived_at) bits.push(`<div style="font-size:.66rem;color:var(--green)">사진 ${d.photo_count||0}장 확보</div>`);
  if(d.outcome==='미수선종결') bits.push('<div style="font-size:.66rem;color:var(--faint)">현장 미수선 종결</div>');

// 서버가 낡아 API 가 404 인 상황과 화면 버그를 구분할 수 없었다.
function bootFail(e){
  var msg = (e && e.message) ? String(e.message) : String(e);
  var stale = /찾을 수 없|404|Not Found/i.test(msg);
  var w = document.getElementById('wrap');
  if(!w) return;
  w.innerHTML = '<div class="card" style="padding:20px">'
    + '<div style="font-weight:800;margin-bottom:8px">화면을 불러오지 못했습니다</div>'
    + '<div class="sub" style="line-height:1.6">' + esc(msg)
    + (stale ? '<br><br><b>서버가 예전 코드로 실행 중일 수 있습니다.</b> 서버를 다시 실행해 주세요.' : '')
    + '</div>'
    + '<div style="margin-top:14px"><a class="btn" href="">다시 시도</a></div>'
    + '</div>';
}

let CF = {status:'', region:'', cat:'', sort:'recent', q:''};
function uniq(arr){ return [...new Set(arr.filter(Boolean))].sort(); }
function filteredCases(){
  let list = (D.cases||[]).slice();
  if(CF.status) list = list.filter(c=>c.status===CF.status);
  if(CF.region) list = list.filter(c=>(c.region||'')===CF.region);
  if(CF.cat)    list = list.filter(c=>(c.category||'').includes(CF.cat));
  //  ⚠ 담당자는 사건을 접수번호가 아니라 **피해자 이름**으로 기억한다.
  //    피해자가 전화해도 이름으로 찾을 수가 없어 목록을 위에서부터 열어봐야 했다.
  if(CF.q){
    const q = CF.q.trim().toLowerCase();
    list = list.filter(c => [c.case_no, c.victim_name, c.victim_phone, c.address,
                             c.region, c.category, c.partner_name]
      .some(v => String(v||'').toLowerCase().includes(q)));
  }
  const s=CF.sort;
  list.sort((a,b)=>{
    //  ⚠ [라운드75] 표에 그리는 금액(위 589행)은 award_amount||low_price 인데
    //    정렬은 low_price 만 봤다(admin.js sortCasesList 와 같은 결함). 경매 없이
    //    확정되는 1차합의 건은 입찰이 없어 low_price 가 비어 있어, 확정 금액이
    //    가장 큰 건이 '높은순' 맨 아래로 밀렸다 — 보이는 열과 다른 기준으로 정렬하면
    //    발주처가 고액 사건을 놓친다. 화면과 같은 값으로 정렬한다.
    const _amt = (x) => (x.award_amount || x.low_price || 0);
    if(s==='award')  return _amt(b) - _amt(a);
    if(s==='saving') return (b.saving||0)-(a.saving||0);
    if(s==='status') return (a.status||'').localeCompare(b.status||'','ko');
    return (b.id||0)-(a.id||0);
  });
  return list;
}

          30분 내 현장 사진·실측 견적을 확보한 뒤 견적 협의 또는 경쟁 입찰로 진행합니다.</div>

    </div>`;

//  금액을 사람이 읽는 단위로 — "3600000" 은 자릿수를 못 세지만 "360만" 은 센다.
function estWords(v){
  v = Math.floor(Number(v)||0);
  const eok = Math.floor(v/100000000), man = Math.floor((v%100000000)/10000), rest = v%10000;
  const p = [];
  if(eok) p.push(eok.toLocaleString()+'억');
  if(man) p.push(man.toLocaleString()+'만');
  if(rest || !p.length) p.push(rest.toLocaleString());
  return p.join(' ');
}

async function createCase(){
  const cats=[...document.querySelectorAll('#c_cats input:checked')].map(x=>x.value);
  if(!cats.length){ toast('피해물 공종을 1개 이상 선택해 주세요.'); return; }
  const noPhoto=document.getElementById('c_nophoto').checked;
  const body={case_no:document.getElementById('c_no').value.trim(),categories:cats,
    region:document.getElementById('c_region').value.trim(),
    //  상세주소(동·호수)는 주소 검색 결과에 없다 — 고른 주소 뒤에 붙여 한 줄로 보낸다
    address:[document.getElementById('c_addr').value.trim(),
             (document.getElementById('c_addr_detail')||{value:''}).value.trim()]
              .filter(Boolean).join(' '),
    //  고른 주소의 좌표 — 있으면 출동 수배가 진짜 거리로 가까운 업체를 부른다
    ...(window.AddrPick ? AddrPick.coords('#c_addr') : {}),
    est_price:document.getElementById('c_est').value,urgent:document.getElementById('c_urgent').checked,
    no_photo:noPhoto,
    victim_name:(document.getElementById('c_vname')||{value:''}).value.trim(),
    victim_phone:(document.getElementById('c_vphone')||{value:''}).value.trim(),
    note:document.getElementById('c_note').value.trim(),
    //  ⚠⚠ [라운드198] RENDER.newcase 가 이 폼을 열 때 발급한 열쇠 — 새로고침·
    //    새 탭·재제출에도 서버가 "같은 사건"으로 알아보게 한다.
    idempotency_key:window.CASE_IDEM_KEY||''};
  //  ⚠ 이 금액이 그대로 입찰 상한(2차는 하한)이 되어 공고로 나간다.
  //     되돌리려면 사건을 취소하거나 시행사들에게 재공고를 돌려야 한다 — 보내기 전에 한 번 읽어 준다.
  const _est = Number(body.est_price);
  if(_est > 0){
    const NL = String.fromCharCode(10);
    const odd = (_est < 100000) ? (NL + '⚠ 10만 원 미만입니다 — 자릿수를 빠뜨리지 않으셨나요?')
              : (_est >= 100000000) ? (NL + '⚠ 1억 원 이상입니다 — 0 을 더 치지 않으셨나요?') : '';
    if(!confirm('가견적 ' + estWords(_est) + '원 (' + _est.toLocaleString() + ')' + NL
                + '이 금액으로 공고를 냅니다. 맞습니까?' + odd)) return;
  }
  //  ★ 중복 제출을 막는다. 종전에는 버튼을 두 번 누르면 **사건이 두 건** 생겼다
  //    (접수번호를 비우면 서버가 매번 새로 뽑으므로 UNIQUE 도 안 걸린다).
  //    같은 사고가 두 건이면 공고도 두 번 나가고 정산도 두 벌이 된다.
  //    협력사 입찰 쪽에는 이미 같은 잠금이 있었다(BID_LOCK).
  if(window.CASE_LOCK) return;
  window.CASE_LOCK = true;
  const _btn = document.querySelector('[data-act="createCase"]');
  const _txt = _btn ? _btn.textContent : '';
  if(_btn){ _btn.disabled = true; _btn.textContent = '접수 중…'; }
  try{
    const r=await api('POST','/api/insurer/cases',body);
    toast(r.no_photo
      ? `사건 <b>${esc(r.case_no)}</b> 접수 완료 — 사진 없는 사고로 접수되어, 인근 업체 출동으로 현장 사진을 먼저 확보합니다`
      : `사건 <b>${esc(r.case_no)}</b> 등록 완료 — 시행사 <b>${r.matched}곳</b>에 입찰 공고가 발송되었습니다`);
    // 피해 사진이 선택돼 있으면 업로드 → AI 파손 분석
    const fin=document.getElementById('c_photos');
    //  ⚠ 사진 업로드 실패를 **조용히 삼키면 안 된다.**
    //    출동 담당자가 찍어 온 사고 현장 사진은 다시 받을 수 없다. 예전에는
    //    if(pd.ok) 에 else 가 없고 catch 가 비어 있어, 용량 초과·장수 초과로 실패해도
    //    화면은 아무 말 없이 사건 목록으로 넘어갔다 — 담당자는 첨부된 줄 알고 닫는다.
    //    (같은 응답을 운영자 화면[admin.js]은 이미 제대로 읽고 있었다)
    let photoFail = false;
    if(fin && fin.files && fin.files.length){
      const total = fin.files.length;
      const fd=new FormData();
      for(const f of fin.files) fd.append('photos', f);
      toast(`피해 사진 ${total}장 올리는 중…`);
      //  ⚠ [라운드76] 이 구간이 도는 동안은 세션만료로 인한 강제이동을 미룬다
      //    (위 api() 주석 참조) — 반드시 아래 try/catch 를 다 벗어난 뒤 끈다.
      UP_BUSY = true;
      try{
        const pr=await fetch('/api/insurer/cases/'+r.id+'/photos',{method:'POST',headers:{'X-CSRF-Token':CSRF},credentials:'same-origin',body:fd});
        const pd=await pr.json().catch(()=>({}));
        if(pd.ok){
          const n = (typeof pd.count === 'number') ? pd.count : total;
          //  ⚠ **중복은 실패가 아니다.** 그 사진은 이미 이 사건에 붙어 있다.
          //    이걸 '빠졌다'고 말하면 담당자는 같은 파일을 계속 다시 올리는데,
          //    올릴 때마다 또 중복이라 0/3장이 되는 무한 루프가 된다.
          const dupN = (pd.duplicates && pd.duplicates.length) || 0;
          if(n + dupN >= total && dupN){
            toast(`사진 <b>${n}장</b> 등록 완료 · 이미 등록된 사진 ${dupN}장은 건너뛰었습니다.`);
          } else if(n < total){
            //  부분 성공 — 몇 장이 왜 빠졌는지 서버가 말해 준다
            photoFail = true;
            toast(`사진 <b>${n}/${total}장</b>만 등록됐습니다. ` +
                  (dupN ? `(이미 등록됨 ${dupN}장) ` : '') +
                  ((pd.errors && pd.errors[0]) ? esc(pd.errors[0]) : '나머지는 다시 올려 주세요.'));
          } else {
            toast(pd.ai_report?`사진 등록 완료 — <b>AI 분석:</b> ${esc(pd.ai_report)}`:(pd.message || '사진을 등록했습니다.'));
          }
        } else {
          photoFail = true;
          toast('사진을 올리지 못했습니다 — ' + esc(pd.error || `서버 응답 ${pr.status}`));
        }
      }catch(e){
        photoFail = true;
        toast('사진 전송 중 통신이 끊겼습니다. 사건은 접수됐으니 상세 화면에서 다시 올려 주세요.');
      } finally {
        UP_BUSY = false;
      }
    }
    await reload();
    //  실패했으면 사건 상세를 바로 열어 준다 — 거기서 다시 붙일 수 있다.
    if(photoFail && r.id){ show('cases'); setTimeout(()=>{ try{ caseDetail(r.id); }catch(e){} }, 200); }
    else { show('cases'); }
  }catch(e){ toast(e.message); }
  finally{
    //  ⚠ 성공·실패 어느 쪽이든 반드시 푼다 — 안 그러면 실패한 뒤 다시 못 낸다.
    window.CASE_LOCK = false;
    if(_btn){ _btn.disabled = false; _btn.textContent = _txt; }
  }
}

  if(!p) return '';
  const s=p.stages||{};
  return `<div class="prog"><i style="width:${p.percent||0}%"></i></div>
    <div class="pstage"><b style="color:var(--sub)">진행율 ${p.percent||0}%</b>
      <span class="${s['착공전']?'on':''}">착공 전</span>

      <span class="${s['완료']?'on':''}">완료</span></div>`;
}

      ${(o.insurer_ack && Number(o.insurer_ack_amount||0) === Number(o.combined_amount||0))

            ${o.insurer_ack==='부동의'?'<div class="sub">마음이 바뀌셨다면 아래에서 다시 회신하실 수 있습니다.</div>':''}
          </div>` : ''}
      ${/*  ⚠ **합산 금액이 정해지기 전에는 회신 칸을 열지 않는다.**

             NO_AMOUNT 로 409 를 준다 — 눌러도 아무 일이 없고, 바로 아래에는
             '경매가 마감되면 확인을 요청드립니다' 안내가 같이 떠 있었다.

      ${/*  ⚠⚠ [라운드113] 위 배지 조건과 정확히 반대로만 열면("확인 있음+금액일치"

      ${(Number(o.combined_amount||0) > 0

                 사전에 가려서 안내하는데, 여기만 '조회' 등급이 확인창까지 통과한
                 뒤 403 을 봤다. */''}
          ${canAct() ? `
          <button class="btn a sm" data-act="coAck" data-arg="${o.id}" data-arg2="1">확인했습니다</button>
          <button class="btn g sm" data-act="coAck" data-arg="${o.id}" data-arg2="0">부동의</button>`
          : `<span class="hint">확인·부동의는 <b>중간관리자 이상</b>만 할 수 있습니다.</span>`}
          <div class="hint" style="margin-top:4px">이 <b>확인이 있어야</b> 시공사가 합산 금액을 확정할 수 있습니다.

      ${(!o.insurer_ack && !Number(o.combined_amount||0))
        ? `<div class="hint" style="margin-top:6px">추가분 경매가 마감되면 합산 금액과 함께 확인을 요청드립니다.</div>` : ''}</div>`;})():''}
    <div class="dsec" id="ebsec"><div class="st">🔎 가견적 점검</div>
      <div id="ebbox" class="hint">불러오는 중…</div></div>
    <div class="dsec"><div class="st">📷 시공 사진 <small style="color:var(--faint);font-weight:600">${allPhotos.length}장</small></div>${photoHtml}</div>

    ${['접수','입찰중','승인대기','시공중'].includes(c.status) ? `
    <div class="dsec"><div class="st">➕ 피해 사진 추가</div>
      <div class="hint" style="margin-bottom:8px">접수할 때 못 올렸거나 나중에 받은 현장 사진을 여기서 붙일 수 있습니다.
        붙이면 AI 파손 분석이 함께 돌아갑니다.</div>
      <label class="btn g sm" style="cursor:pointer">사진 고르기

        <div class="di"><span class="l">지급 검수</span><span class="v">${stTag(sett.review_status)}</span></div>
      </div></div>`:''}
    ${bids.length?`<div class="dsec"><div class="st">🏷️ 입찰 현황 <small style="color:var(--faint);font-weight:600">${bids.length}건</small></div>
      <div class="tbl-wrap"><table class="tbl"><tr><th>순위</th><th>시행사</th><th class="r">입찰가</th><th class="r">공기</th></tr>
      ${bids.slice(0,6).map((b,i)=>`<tr><td>${i+1}</td><td>${esc(b.partner_name||'-')}</td><td class="r em">${won(b.amount)}</td><td class="r">${b.days||'-'}일</td></tr>`).join('')}

      </table></div></div>`:''}
    <div class="modal-foot">
      ${c.status==='승인대기'?`<button class="btn a" data-act="awardView" data-arg="${cid}">낙찰 승인</button>`:''}
      ${/*  ⚠ 잘못 등록한 사건(가견적 오타·주소 오선택)을 되돌릴 창구가 없었다.
             입찰이 들어오기 전까지만 스스로 접을 수 있게 한다. */''}
      ${(['접수','입찰중'].includes(c.status) && !bids.length && canAct())
        ? `<button class="btn g" data-act="cancelCase" data-arg="${cid}"
             title="입찰이 들어오기 전까지만 취소할 수 있습니다">사건 취소</button>` : ''}
      <span style="flex:1"></span><button class="btn g" data-act="closeModal">닫기</button>
    </div>`);

  //  피해 사진 추가 — 고르는 즉시 올리고, 결과를 그 자리에 남긴다(토스트는 스쳐 지나간다)
  const _ap = document.getElementById('ic_addph');
  if(_ap) _ap.addEventListener('change', async () => {
    const msg = document.getElementById('ic_addph_msg');
    if(!_ap.files || !_ap.files.length) return;
    const total = _ap.files.length;
    const fd = new FormData();
    for(const f of _ap.files) fd.append('photos', f);
    if(msg){ msg.textContent = `${total}장 올리는 중…`; msg.style.color = 'var(--sub)'; }
    //  ⚠ [라운드76] 위 createCase 와 같은 이유 — 이 구간이 도는 동안은
    //    세션만료로 인한 강제이동을 미룬다.
    UP_BUSY = true;
    try{
      const pr = await fetch('/api/insurer/cases/' + cid + '/photos',
        {method:'POST', headers:{'X-CSRF-Token':CSRF}, credentials:'same-origin', body:fd});
      const pd = await pr.json().catch(()=>({}));
      if(pd.ok){
        const n = (typeof pd.count === 'number') ? pd.count : total;
        //  ⚠ 재업로드가 바로 이 루프의 진입점이다 — '다시 올려 주세요' 를 따르면
        //    전부 중복이라 0/3장이 뜨고, 그걸 보고 또 다시 올린다.
        const dupN = (pd.duplicates && pd.duplicates.length) || 0;
        if(msg){
          if(n + dupN >= total && dupN){
            msg.textContent = n
              ? `${n}장 등록 완료 · 이미 등록된 ${dupN}장은 건너뛰었습니다`
              : `이미 등록된 사진입니다(${dupN}장) — 다시 올려도 같은 결과입니다`;
            msg.style.color = 'var(--green)';
          } else {
            msg.textContent = n < total
              ? `${n}/${total}장만 등록됐습니다 — ${(pd.errors && pd.errors[0]) || '나머지를 다시 시도해 주세요'}`
              : `${n}장 등록 완료`;
            msg.style.color = n < total ? 'var(--red)' : 'var(--green)';
          }
        }
        _ap.value = '';
        if(n) setTimeout(()=>caseDetail(cid), 900);      // 목록 갱신
      } else {
        if(msg){ msg.textContent = pd.error || `서버 응답 ${pr.status}`; msg.style.color='var(--red)'; }
      }
    }catch(e){
      if(msg){ msg.textContent = '통신이 끊겼습니다. 다시 시도해 주세요.'; msg.style.color='var(--red)'; }
    } finally {
      UP_BUSY = false;
    }

      <div class="di"><span class="l">표준단가 개산 구간</span><span class="v">${(a.engine_low||a.engine_high)?won(a.engine_low)+' ~ '+won(a.engine_high)+'원':'근거 없음'}</span></div>
      <div class="di"><span class="l">가견적(${r.case.auction_round===2?'2차 최소금액':'상한'})</span><span class="v">${won(r.case.auction_round===2?(r.case.est_price||a.engine_low):r.case.est_price)}원</span></div>
      ${r.case.auction_round===2?`<div class="di"><span class="l">현장 실견적</span><span class="v">${won(r.case.field_ref)}원</span></div>`:''}
      <div class="di"><span class="l">현장 사진</span><span class="v">${(r.photos||[]).length}장</span></div>
    </div>
    ${gap!==null?`<div class="hint" style="margin-top:6px">현장 견적은 개산 상한 대비 ${gap>0?'+':''}${gap}% 입니다.
      ${gap>20?'<b style="color:var(--red)">구간을 크게 벗어납니다 — 부동의 후 2차 경매를 고려하세요.</b>':''}</div>`:''}
    ${b?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:.78rem;color:var(--blue)">개산 근거 상세 (패턴·수량·단가)</summary>
      <div style="font-size:.74rem;margin-top:6px">
        <div>수선 유형: <b>${esc(b.name||a.engine_pattern||'')}</b> · 엔진 ${esc(a.engine_ver||'-')}</div>
        <div>직접공사비 ${won(b.direct_cost)}원 · 할증 ${(b.markup||[]).join('~')}배 · ${esc(b.gate||'')}</div>
        <div class="tbl-wrap"><table class="tbl" style="margin-top:6px"><tr><th>품명</th><th class="r">수량</th><th class="r">단가</th><th class="r">금액</th></tr>
        ${(b.lines||[]).map(l=>`<tr><td>${esc(l.item||l.name||'')}</td><td class="r">${esc(String(l.qty??''))}</td>
          <td class="r">${won(l.unit_price||l.price)}</td><td class="r">${won(l.amount)}</td></tr>`).join('')}
        </table></div>
        <div class="hint" style="margin-top:4px">${esc(b.disclaimer||'')}</div>
      </div></details>`:'<div class="hint" style="margin-top:8px">표준단가 개산 근거가 첨부되지 않았습니다(수선 유형 미선택 또는 입력 부족).</div>'}
    <div class="field" style="margin-top:12px"><label>부동의 사유 (부동의 시 필수)</label>
      <input id="fa_reason" placeholder="예: 견적 금액이 통상 복구 범위를 초과"></div>
    <div class="modal-foot">
      ${/*  ⚠ 서버는 이 두 버튼을 중간관리자 이상으로 잠근다
             (@require_portal_role("insurer","중간관리자")). 그런데 화면에는

async function faDecide(cid, approve){
  approve = Number(approve)===1;
  const reason = (document.getElementById('fa_reason')||{value:''}).value.trim();
  if(!approve && !reason){ toast('부동의 사유를 입력해 주세요.'); return; }
  //  ★ **무엇을 확정하는지 확인창이 말한다.** 종전에는 "이 금액으로 승인하시겠습니까?"
  //    뿐이라, 목록에서 다른 건을 열었다 닫은 뒤 누르면 어느 사건·얼마인지 모른 채
  //    확정했다. 이건 계약 성립이고 경매를 건너뛰는 결정이라 되돌릴 수 없다.
  if(approve){
    const _fa = window.FA_VIEW || {};
    const _amt = Number(_fa.amount || 0);
    if(!confirm('[' + (_fa.case_no || ('사건 ' + cid)) + ']'
                + String.fromCharCode(10)
                + (_fa.partner ? _fa.partner + ' · ' : '')
                + _amt.toLocaleString('ko-KR') + '원으로 승인합니다.'
                + String.fromCharCode(10) + String.fromCharCode(10)
                + '승인하면 경매 없이 이 업체가 바로 시공을 시작하고,'
                + String.fromCharCode(10)
                + '이 금액이 계약금액이 됩니다. 되돌릴 수 없습니다.')) return;
  }
  try{
    const r = await api('POST','/api/insurer/cases/'+cid+'/field-agreement/decision',
      {approve, reason});
    toast(r.message); closeModal(); await reload(); show('home');
  }catch(e){
    //  [라운드477] 승인 경합에서 진 경우 서버는 최신 상태를 담아 알려주는데,
    //    화면은 토스트만 띄우고 모달은 낡은 데이터를 그대로 보여주고 있었다 —
    //    성공 분기와 같이 닫고 새로고침한다.
    toast(esc(e.message)); closeModal(); await reload(); show('home');
  }
}

// 추가공사 증액 확인·부동의 (기록 전용 — 금액은 바뀌지 않는다)

async function setSeverity(cid, sev){

async function estAck(cid){

  try{
    const r=await api('GET','/api/insurer/notifications');

async function goNotif(id){
  const n=NOTIFS.find(x=>x.id===id);
  try{ await api('POST','/api/insurer/notifications/read',{id}); }catch(e){}
  BELL_OPEN=false; document.getElementById('bellPop').style.display='none';

const W_LABEL = {price:'가격', days:'공기', rating:'평점', region:'지역', defect:'하자'};
function weightText(w){
  if(!w) return '가격·공기·평점·지역·하자 가중 평가';
  return '가중치 ' + Object.keys(W_LABEL)
    .filter(k => w[k] !== undefined)
    .map(k => W_LABEL[k] + ' ' + Math.round(Number(w[k])*100) + '%')
    .join(' · ');
}

        <b>최종 선택은 담당자가 하며</b>, 최저가가 아닌 업체를 고르면 사유가 기록됩니다.</p>`:''}
      ${bids.length?`<div class="field" style="margin-top:14px"><label>최저가가 아닌 업체 선택 시 사유 <span style="color:var(--faint);font-weight:600">(선정 근거로 기록됩니다)</span></label>
        <input id="aw_reason" placeholder="예: 공기 단축 필요, 인근 시공 실적 우수"></div>`:''}
      <div class="modal-foot">
        ${bids.length?(canAct()
            ? `<button class="btn a" data-act="doAward" data-arg="${cid}">낙찰 승인</button>`
            : '<span class="sub" style="font-size:.75rem">조회 전용 계정입니다 — 승인은 상위 등급만 가능합니다</span>'):''}
        ${/*  ⚠ 예전에는 '승인' 아니면 '닫기'뿐이었다. 값이 전부 예산을 넘어도,
               업체가 미덥지 않아도 담당자가 누를 것이 없어 사건이 그대로 멈췄다. */''}
        ${canAct() ? `<button class="btn g" data-act="rejectBids" data-arg="${cid}"
          title="이 입찰들을 받지 않고 다시 공고하도록 요청합니다">전부 반려 · 재공고 요청</button>` : ''}
        <span style="flex:1"></span><button class="btn g" data-act="closeModal">닫기</button>
      </div>`);
  }catch(e){ toast(e.message); }
}
//  들어온 입찰을 받지 않겠다는 의사 표시 — 재공고 요청.
//   ⚠ 이 버튼은 사건 상태·금액을 바꾸지 않는다. 유찰 확정·재공고는 운영팀 권한이다.
//     담당자가 "값이 안 맞는다"고 말할 창구가 없어 사건이 그대로 멈추던 것을 연다.
async function rejectBids(cid){
  const NL = String.fromCharCode(10);
  const reason = prompt('이 입찰들을 받지 않고 다시 공고하도록 요청합니다.' + NL + NL +
    '사유를 5자 이상 적어 주세요 (예: 전 건 예산 초과, 공기 과다).' + NL +
    '· 사건 상태는 바뀌지 않습니다 — 복구온 운영팀이 확인 후 처리합니다.');
  if(reason === null) return;
  if(reason.trim().length < 5){ toast('사유를 5자 이상 적어 주세요.'); return; }
  try{
    const r = await api('POST', `/api/insurer/cases/${cid}/reject-bids`, {reason: reason.trim()});
    toast(r.message || '재공고 요청을 접수했습니다.');
    closeModal(); reload().then(()=>show('cases'));
  }catch(e){
    //  [라운드479] 이 버튼은 doAward()와 같은 낙찰승인 모달 안에 나란히 있다 —
    //    누군가 먼저 낙찰을 승인해 시공중으로 넘어간 뒤 이 버튼을 누르면 실패
    //    토스트만 뜨고 이미 끝난 사건의 낙찰승인 모달이 그대로 남았다(477라운드가
    //    doAward() 자신엔 이미 고친 것과 같은 결함). 성공 분기와 같이 처리한다.
    toast(e.message); closeModal(); reload().then(()=>show('cases'));
  }
}

//  잘못 등록한 사건 접기 — 입찰이 들어오기 전까지만.
async function cancelCase(cid){
  const NL = String.fromCharCode(10);
  const reason = prompt('이 사건을 취소합니다.' + NL + NL +
    '사유를 5자 이상 적어 주세요 (예: 가견적 자릿수 오기, 중복 등록).' + NL +
    '· 입찰이 들어온 뒤에는 취소할 수 없습니다.' + NL +
    '· 취소해도 기록은 남습니다. 올바른 내용으로 다시 등록해 주세요.');
  if(reason === null) return;
  if(reason.trim().length < 5){ toast('사유를 5자 이상 적어 주세요.'); return; }
  try{
    const r = await api('POST', `/api/insurer/cases/${cid}/cancel`, {reason: reason.trim()});
    toast(r.message || '사건을 취소했습니다.');
    closeModal(); reload().then(()=>show('cases'));
  }catch(e){
    //  [라운드479] 이 버튼은 입찰 0건일 때만 보인다 — 취소 사유를 입력하는 사이
    //    입찰이 들어오면 서버는 HAS_BIDS로 막는데 화면은 "입찰 없음" 낡은 모달을
    //    그대로 보여줬다. 성공 분기와 같이 닫고 새로고침한다(477라운드 패턴).
    toast(e.message); closeModal(); reload().then(()=>show('cases'));
  }
}

function pickBid(id){
  SELBID=id;
  document.querySelectorAll('#bidlist .rank').forEach(r=>r.classList.remove('sel'));
  document.getElementById('bid'+id).classList.add('sel');
}
async function doAward(cid){
  const reason=document.getElementById('aw_reason')?document.getElementById('aw_reason').value.trim():'';
  //  ⚠ 낙찰 승인은 곧 계약 성립이다. 누르는 즉시 시공이 시작되고 탈락 업체 전원에게
  //     통지가 나가며, 되돌리는 경로는 이 화면에 없다(운영팀 권한). 한 번 되읽어 준다.
  const _b = (AW_BIDS||[]).find(x=>x.id===SELBID);
  if(_b){
    const NL = String.fromCharCode(10);
    if(!confirm('낙찰 승인' + NL + NL
                + '업체: ' + _b.partner_name + NL
                + '금액: ' + Number(_b.amount||0).toLocaleString('ko-KR') + '원'
                + (_b.days ? (NL + '공기: ' + _b.days + '일') : '') + NL + NL
                + '승인하면 이 업체가 시공을 시작하고, 나머지 업체에는 탈락이 통지됩니다.' + NL
                + '되돌리려면 복구온 운영팀에 연락하셔야 합니다. 진행할까요?')) return;
  }
  try{
    await api('POST','/api/insurer/cases/'+cid+'/award',{bid_id:SELBID,reason});
    closeModal(); toast('낙찰이 <b>승인</b>되었습니다 — 선정 근거가 자동 기록되었습니다');
    await reload(); show('cases');
  }catch(e){
    //  [라운드477] 낙찰승인 경합에서 진 경우도 같은 문제 — 실패 분기만
    //    모달을 안 닫고 새로고침도 안 해 낡은 화면이 남았다.
    toast(e.message); closeModal(); await reload(); show('cases');
  }
}

//  보험사가 고른 지적 사진 — {photo_id: 사유}
let DEFECT_MARKS = {};

//  완료 사진을 불러와 **사진마다 체크 + 사유**를 달 수 있게 한다.
//   글자 한 줄("방수 마감 불량")만 넘기면 시행사는 어느 지점인지 모른 채 현장에 간다.
async function loadDefectPhotos(cid){
  const box = document.getElementById('d_photos');
  if(!box) return;
  box.innerHTML = '<div class="sub" style="padding:8px">완료 사진 불러오는 중…</div>';
  let d;
  try{ d = await api('GET', `/api/cases/${cid}/photos`); }
  catch(e){ box.innerHTML = `<div class="sub" style="padding:8px">사진을 불러오지 못했습니다 (${esc(e.message)})</div>`; return; }
  const list = [].concat(d.construction||[], d.unclassified||[]);
  if(!list.length){ box.innerHTML = '<div class="sub" style="padding:8px">이 사건에는 등록된 사진이 없습니다.</div>'; return; }
  box.innerHTML = `<div class="pgrid">${list.map(p=>`
    <figure class="pcell dmark" data-pid="${p.id}">
      <img src="${p.url}" alt="${esc(p.kind||'시공')} 사진" style="cursor:pointer">
      <figcaption style="padding:6px 8px">
        <label class="check" style="font-size:.76rem;display:flex;gap:5px;align-items:center">
          <input type="checkbox" data-mark="${p.id}" style="width:auto"> ${esc(p.kind||'기타')} — 하자 지적
        </label>
        <input data-marknote="${p.id}" placeholder="이 사진의 어디가 문제인가요" hidden
               style="margin-top:5px;font-size:.76rem;padding:5px 7px">
      </figcaption>
    </figure>`).join('')}</div>`;
  box.querySelectorAll('[data-mark]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const note = box.querySelector(`[data-marknote="${cb.dataset.mark}"]`);
      note.hidden = !cb.checked;
      cb.closest('.pcell').style.outline = cb.checked ? '2.5px solid var(--red)' : '';
      if(cb.checked) note.focus(); else delete DEFECT_MARKS[cb.dataset.mark];
    });
  });
  box.querySelectorAll('[data-marknote]').forEach(inp=>{
    inp.addEventListener('input', ()=>{ DEFECT_MARKS[inp.dataset.marknote] = inp.value; });
  });
  //  ⚠ 하자를 잡아내려면 **크게 봐야 한다.** 썸네일로는 실링 벌어짐이 안 보인다.
  //    확대 화면에서 넘겨 보다가 문제 사진을 찾으면 닫고 체크한다.
  if(window.Lightbox) Lightbox.bind(box, {caption: img =>
    `${esc(img.alt||'')} <span style="opacity:.7">— 닫고 체크한 뒤 사유를 적어 주세요</span>`});
}

async function submitDefect(cid){
  const title=document.getElementById('d_title').value.trim();
  if(!title){ toast('하자 제목을 입력해 주세요.'); return; }
  try{
    //  체크된 사진 + 사진별 사유를 함께 보낸다
    const marks = [...document.querySelectorAll('[data-mark]:checked')].map(cb=>({
      photo_id: Number(cb.dataset.mark), note: (DEFECT_MARKS[cb.dataset.mark]||'').trim()}));
    const r=await api('POST','/api/defects',{case_id:cid,title,
      content:document.getElementById('d_content').value.trim(),
      severity:document.getElementById('d_sev').value, photos: marks});
    closeModal();
    const pn = r.marked_photos ? ` · 지적 사진 <b>${r.marked_photos}장</b> 전달` : '';
    toast((r.warranty_ok?'하자가 <b>접수</b>되었습니다 — 시행사에 통보되었습니다'
      :'하자가 접수되었습니다 (⚠ 보증기간 경과 — 비용 부담 협의 필요)') + pn);
    await reload(); show('defects');
  }catch(e){ toast(e.message); }
}

//  하자 목록의 「사건」 칸 — 접수번호만 있으면 어떤 현장인지 알 수 없어 하나씩 열어 봐야 했다.

//  지적 ↔ 보수 대조 — 내가 짚은 자리가 실제로 고쳐졌는지 나란히 본다.
async function defectCompare(did){
  const d = (D.defects||[]).find(x=>x.id===did) || {};
  let r;
  try{ r = await api('GET', `/api/defects/${did}/photos`); }
  catch(e){ toast(e.message); return; }
  const marked = r.marked || [];
  openModal(`<h3>지적 ↔ 보수 대조 — ${esc(d.defect_no||'')}</h3>
    <div class="msub">${esc(d.case_no||'')} · ${esc(d.title||'')} · ${esc(d.partner_name||'')}</div>
    <div class="notice" style="margin:10px 0;${r.all_fixed?'':'border-color:var(--amber)'}">
      지적 <b>${marked.length}곳</b> 중 보수 사진이 올라온 곳 <b>${r.fixed_count||0}곳</b>
      ${r.all_fixed?' — 모두 대조 가능합니다.':' — 나머지는 아직 사진이 없습니다.'}</div>
    ${marked.map(m=>{
      const fx=(m.fixes||[])[0];
      return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;border:1px solid var(--mist);
                   border-radius:12px;padding:10px;margin-bottom:10px">
        <figure class="pcell" style="outline:2.5px solid var(--red);margin:0">
          <img src="${esc(m.url)}" alt="지적 사진">
          <figcaption style="padding:7px 9px"><div style="font-size:.7rem;color:var(--faint)">지적</div>
            <div style="font-size:.78rem;font-weight:700;color:var(--red);line-height:1.5">
              ${m.note?esc(m.note):'(사유 미기재)'}</div></figcaption></figure>
        ${fx?`<figure class="pcell" style="outline:2.5px solid #1F8A55;margin:0">
          <img src="${esc(fx.url)}" alt="보수 사진">
          <figcaption style="padding:7px 9px"><div style="font-size:.7rem;color:var(--faint)">보수</div>
            <div style="font-size:.75rem;color:var(--sub)">${esc((fx.created_at||'').slice(0,16))} · ${esc(fx.uploader||'')}</div>
          </figcaption></figure>`
        :`<div class="empty" style="display:grid;place-items:center;min-height:120px">아직 보수 사진 없음</div>`}
      </div>`;}).join('') || '<div class="empty">지적된 사진이 없습니다.</div>'}

    <div class="modal-foot"><span style="flex:1"></span>
      <button class="btn g" data-act="closeModal">닫기</button></div>`);
  if(window.Lightbox){
    const noteBy = {};
    marked.forEach(m=>{
      noteBy[`/api/photos/${m.id}/file`] = m.note ? `<b>지적 사유</b> — ${esc(m.note)}` : '';
      (m.fixes||[]).forEach(f=>{ noteBy[`/api/photos/${f.id}/file`] =

        <div class="mp-ro"><label>기관명</label><div class="mp-fixed">${esc(i.name||'')}</div></div>
        <div class="mp-ro"><label>구분</label><div class="mp-fixed">${esc(i.org_type||'-')}</div></div>
        <div class="mp-ro"><label>담당자</label><input id="mi_mgr" value="${esc(i.manager||'')}"></div>
        <div class="mp-ro"><label>부서</label><input id="mi_dept" value="${esc(i.dept||'')}"></div>
        <div class="mp-ro"><label>연락처</label><input id="mi_phone" value="${esc(i.phone||'')}"></div>
        <div class="mp-ro"><label>이메일</label><input id="mi_email" value="${esc(i.email||'')}"></div>
      </div>
      <button class="btn p" id="mi_save" style="margin-top:12px">정보 저장</button>
    </div>
    <div class="panel">
      <div class="ph"><span class="pt">비밀번호 변경</span></div>
      <div class="mp-grid">
        <div class="mp-ro"><label>현재 비밀번호</label><input id="mi_cur" type="password" autocomplete="current-password"></div>
        <div class="mp-ro"><label>새 비밀번호</label><input id="mi_new" type="password" autocomplete="new-password"></div>
        <div class="mp-ro"><label>새 비밀번호 확인</label><input id="mi_new2" type="password" autocomplete="new-password"></div>
      </div>
      <button class="btn a" id="mi_pw" style="margin-top:12px">비밀번호 변경</button>
    </div>`;
  document.getElementById('mi_save').addEventListener('click', async ()=>{
    try{ await api('PATCH','/api/insurer/profile',{manager:val('mi_mgr'),dept:val('mi_dept'),phone:val('mi_phone'),email:val('mi_email')}); toast('정보를 저장했습니다.'); }
    catch(e){ toast(e.message); }
  });
  document.getElementById('mi_pw').addEventListener('click', async ()=>{
    const cur=val('mi_cur'), nw=val('mi_new'), nw2=val('mi_new2');
    if(!cur||!nw){ toast('현재·새 비밀번호를 입력하세요.'); return; }
    if(nw!==nw2){ toast('새 비밀번호가 서로 다릅니다.'); return; }
    try{ await api('POST','/api/change-password',{current:cur,new:nw}); toast('비밀번호를 변경했습니다.'); }
    catch(e){ toast(e.message); }
  });
};

boot();


// ── 인라인 핸들러 대체 (CSP nonce 전환) ──────────────────────
//  data-act="이름" 으로 적힌 동작을 실제 함수에 연결한다.
//  ⚠ 즉시실행 함수로 감싼다 — 클래식 스크립트들이 전역 렉시컬 스코프를 공유하므로
//    최상위에서 const ACT 를 선언하면 다른 스크립트와 중복 선언 충돌이 나고,
//    그 스크립트가 통째로 실행되지 않는다(화면이 "불러오는 중…" 에서 멈춘다).
(function () {
  window.ACT = window.ACT || {};
  var ACT = window.ACT;
  // data 속성은 항상 문자열이라, 숫자를 받던 함수가 깨지지 않도록 되돌린다
  var _n = function (v) { return (v !== null && v !== "" && !isNaN(v)) ? Number(v) : v; };
  ACT.awardView = (a, el, ev, b) => awardView(_n(a), _n(b), el, ev);
  ACT.closeModal = (a, el, ev, b) => closeModal(_n(a), _n(b), el, ev);
  ACT.createCase = (a, el, ev, b) => createCase(_n(a), _n(b), el, ev);
  // 사진 없음 토글 — 가견적 칸을 잠그고 안내를 띄운다(사진 없이는 가견적을 낼 수 없다)
  //  ★ 고른 공종에 개산 근거가 없으면 그 자리에서 알린다. 금액은 만들지 않는다(철칙 3).
  //    판정은 서버가 준 need_est_majors 하나만 본다.
  ACT.catCoverageIns = () => {
    const box = document.getElementById('cov_warn_ins');
    if(!box) return;
    const need = (D.need_est_majors || []);
    const picked = [...document.querySelectorAll('#c_cats input:checked')].map(x=>x.value);
    const hit = picked.filter(m => need.includes(m));
    if(!hit.length){ box.style.display='none'; box.innerHTML=''; return; }
    box.style.display = 'block';
    box.innerHTML = `<b>${hit.map(esc).join(' · ')}</b> 은(는) 표준단가 개산 근거가 없습니다.<br>
      사진 없이 접수해 <b>2차 공고</b>로 가면 최소 금액(하한)을 만들 근거가
      <b>가견적뿐</b>입니다 — 아래 가견적을 꼭 적어 주세요.`;
  };

  ACT.toggleNoPhoto = () => {
    const on = document.getElementById('c_nophoto').checked;
    const est = document.getElementById('c_est');
    const hint = document.getElementById('nophoto-hint');
    //  ⚠⚠ **잠그지 않는다.** 종전에는 '사진 없음' 을 켜면 가견적 칸을 비우고
    //    disabled 로 잠갔다. 그런데 바로 그 칸의 라벨이 "사진 없이 접수해 현장
    //    확인이 먼저 필요한 건은, 이 금액이 2차 공고에서 **최소 금액**이 됩니다"
    //    라고 말한다 — 화면이 스스로 모순됐다.
    //    더 나쁜 결과: 발주처로 들어온 사진없음 접수는 100% est_price=0 이 되고,
    //    개산 레시피가 없는 3공종(방음벽·휀스·펜스 / 조경·수목 / 종합 원상복구)과
    //    겹치면 2차 하한을 만들 근거가 둘 다 없어 공고가 영구히 막힌다
    //    (가견적 수정은 '입찰중' 전용이라 그때는 이미 늦다).
    //    서버는 이 라운드에 값을 **보존하도록** 고쳐 놨는데 화면이 막고 있었다.
    //    형제인 어드민 콘솔은 잠그지 않고 경고만 띄운다 — 같게 맞춘다.
    if(est){ est.disabled = false; est.style.background = ''; }
    if(hint) hint.style.display = on ? '' : 'none';
  };
  //  ⚠ 가견적은 **입찰 상한**(2차에서는 하한)이 된다. 0 하나 더 치면 그대로 공고가 나간다.
  //     숫자만 보고는 자릿수를 못 센다 — 옆에 한글로 읽어 준다.
  ACT.estRead = () => {
    const el = document.getElementById('c_est'), out = document.getElementById('c_est_read');
    if(!el || !out) return;
    const v = Number(el.value);
    if(!el.value || !isFinite(v) || v <= 0){ out.textContent=''; out.style.color=''; return; }
    let msg = estWords(v) + '원';
    let color = 'var(--faint)';
    if(v < 100000){ msg += ' — 10만 원 미만입니다. 자릿수를 확인해 주세요.'; color = 'var(--warn,#B7791F)'; }
    else if(v >= 100000000){ msg += ' — 1억 원 이상입니다. 자릿수를 확인해 주세요.'; color = 'var(--warn,#B7791F)'; }
    out.textContent = msg; out.style.color = color;
  };
  ACT.defectForm = (a, el, ev, b) => defectForm(_n(a), _n(b), el, ev);
  ACT.defectCompare = (a) => defectCompare(_n(a));   // 지적 ↔ 보수 나란히 보기
  ACT.rejectBids = (a) => rejectBids(_n(a));         // 전부 반려 · 재공고 요청
  ACT.cancelCase = (a) => cancelCase(_n(a));         // 잘못 등록한 사건 취소
  ACT.doCaseSearch = () => { const el=document.getElementById('f_q');
    CF.q = el ? el.value : ''; RENDER.cases(); };
  ACT.doAward = (a, el, ev, b) => doAward(_n(a), _n(b), el, ev);
  ACT.logout = (a, el, ev, b) => logout(_n(a), _n(b), el, ev);
  ACT.modalBackdrop = (a, el, ev) => { if (ev.target === el) closeModal(); };
  ACT.pickBid = (a, el, ev, b) => pickBid(_n(a), _n(b), el, ev);
  ACT.printPage = () => window.print();
  ACT.show = (a, el, ev, b) => show(_n(a), _n(b), el, ev);
  ACT.submitDefect = (a, el, ev, b) => submitDefect(_n(a), _n(b), el, ev);
  ACT.caseDetail = (a, el, ev, b) => caseDetail(_n(a), _n(b), el, ev);
  ACT.approveDone = (a, el, ev, b) => approveDone(_n(a), _n(b), el, ev);
  ACT.setSeverity = (a, el, ev, b) => setSeverity(_n(a), b);
  ACT.estAck = (a) => estAck(_n(a));
  ACT.faView = (a) => faView(_n(a));
  ACT.faDecide = (a, el, ev, b) => faDecide(_n(a), _n(b));
  ACT.coAck = (a, el, ev, b) => coAck(_n(a), _n(b));
  ACT.rpApply = () => rpApply();
  ACT.rpClear = () => rpClear();
  ACT.rpExport = () => rpExport();
  ACT.insStmtExport = () => {
    //  ⚠ <select> 가 없을 때만 쓰는 방어적 기본값이다 — 실제 화면에선 위 select 가
    //    이미 지난달을 선택해 두므로 평소엔 이 폴백을 안 탄다(RENDER.settle 참고).
    const [_fy, _fm] = todayKST().split('-').map(Number);
    const _flastY = _fm === 1 ? _fy - 1 : _fy, _flastM = _fm === 1 ? 12 : _fm - 1;
    var y = (document.getElementById('ins_st_year') || {}).value || _flastY;
    var m = (document.getElementById('ins_st_month') || {}).value || _flastM;
    window.open('/api/insurer/statement/export?year=' + y + '&month=' + m, '_blank');
  };
  ACT.subCreate = () => subCreate();
  ACT.subReset = (a, el, ev, b) => subReset(_n(a));
  ACT.subToggle = (a, el, ev, b) => subToggle(_n(a), el);
  ACT.subDel = (a, el, ev, b) => subDel(_n(a));
  ACT.toggleBell = (a, el, ev) => { ev.stopPropagation(); toggleBell(); };
  ACT.readAll = (a, el, ev) => { ev.stopPropagation(); readAll(); };
  ACT.goNotif = (a, el, ev, b) => goNotif(_n(a), _n(b), el, ev);
})();

</script>
