# ══════════════════════════════════════════════════════════════
#  복구온 서비스 — nginx 리버스 프록시 설정
#  ㈜올림포스네트웍스 기획팀 유경탁
#
#  배치: /etc/nginx/sites-available/bokguon  → sites-enabled 심볼릭 링크
#  적용: sudo nginx -t && sudo systemctl reload nginx
# ══════════════════════════════════════════════════════════════

# HTTP → HTTPS 강제 리다이렉트
# (개인정보 안전성 확보조치 기준 §7 전송구간 암호화)
server {
    listen 80;
    listen [::]:80;
    server_name bokguon.example.com;    # ← 실제 도메인으로 교체

    # Let's Encrypt 갱신 경로만 HTTP 허용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx 1.25.1 이상은 listen 의 http2 인자가 폐기되었다. 별도 지시자를 쓴다.
    # (구버전 nginx 라면 이 줄을 지우고 위 listen 에 http2 를 다시 붙일 것)
    http2 on;
    server_name bokguon.example.com;    # ← 실제 도메인으로 교체

    # ── TLS (certbot 발급) ──────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/bokguon.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bokguon.example.com/privkey.pem;

    # TLS 1.2 이상만 허용 (KISA 권장 — 1.0/1.1 비활성)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    # ⚠ resolver 가 없으면 stapling 이 조용히 동작하지 않는다(경고만 뜨고 넘어간다).
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── 보안 헤더 (앱에서도 설정하지만 프록시 단에서 이중 방어) ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 서버 버전 노출 차단
    server_tokens off;

    # 업로드 크기 제한 — 시공 사진 일괄 업로드(장당 8MB × 최대 30장)를 담을 수 있게.
    #  앱의 BOKGUON_MAX_UPLOAD_MB(기본 260) 와 반드시 같은 값으로 맞출 것.
    client_max_body_size 260m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # ── 로그 ────────────────────────────────────────────────
    access_log /var/log/nginx/bokguon.access.log;
    error_log  /var/log/nginx/bokguon.error.log warn;

    # ── 레이트 리밋 (앱 단과 이중 방어) ─────────────────────
    # http 블록에 아래 선언 필요:
    #   limit_req_zone $binary_remote_addr zone=bokguon_login:10m rate=10r/m;
    #   limit_req_zone $binary_remote_addr zone=bokguon_api:10m rate=120r/m;

    location = /api/login {
        limit_req zone=bokguon_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8771;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/partner/login {
        limit_req zone=bokguon_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8771;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 보험사 로그인도 같은 보호를 받아야 한다 (예전에는 누락돼 무제한이었다)
    location = /api/insurer/login {
        limit_req zone=bokguon_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8771;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 비밀번호 변경도 무차별 대입 대상이다
    location = /api/change-password {
        limit_req zone=bokguon_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8771;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 관리자 콘솔 IP 제한 (고시 §6 접근통제) ──────────────
    # 사무실 고정 IP만 허용하려면 주석 해제 후 IP 지정
    # location /admin {
    #     allow 203.0.113.10;      # ← 사무실 IP
    #     deny all;
    #     proxy_pass http://127.0.0.1:8771;
    #     include /etc/nginx/proxy_params;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ── 압축 (한글 HTML·CSS·JS 는 압축 효과가 크다) ─────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml image/svg+xml;

    # ── 헬스체크는 로그를 남기지 않는다 (분당 수십 건 쌓임) ──
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8771;
        include /etc/nginx/proxy_params;
    }

    # ── 사진 파일 서빙은 레이트리밋에서 제외 ──
    #  검수 화면 한 번이 사진 장수만큼 요청을 낸다(30장 = 30요청).
    #  일반 API 리밋(120r/m)에 걸리면 이미지가 503 으로 깨진다.
    #  파일 조회는 인증을 거치고 부작용이 없으므로 리밋 대상이 아니다.
    location ~ ^/api/photos/\d+/file$ {
        proxy_pass http://127.0.0.1:8771;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 10m;
        add_header Cache-Control "private, max-age=600";
    }

    # ── 정적 파일은 nginx가 직접 서빙 (성능) ────────────────
    #  앱이 /static/style.css?v=<내용해시> 형태로 링크하므로,
    #  파일 내용이 바뀌면 URL 이 바뀐다 → 길게 캐시해도 옛 파일을 잡지 않는다.
    location /static/ {
        alias /opt/bokguon/static/;
        expires 1y;
        # ⚠ location 안에서 add_header 를 하나라도 쓰면 **상위 블록의 add_header 가 전부 무효**가 된다.
        #    (nginx 의 add_header 는 상속이 아니라 '덮어쓰기'다)
        #    그래서 정적 파일에도 보안 헤더를 다시 명시해야 한다.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }

    # ── 애플리케이션 ────────────────────────────────────────
    location / {
        limit_req zone=bokguon_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8771;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # 업로드 초과(413)를 JSON 으로 — 화면이 이유를 표시할 수 있게
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"ok":false,"error":"업로드 용량을 초과했습니다. 사진 장수를 줄여 다시 시도해 주세요.","code":"TOO_LARGE"}';
    }

    # ── .well-known (예: 안드로이드 앱스토어 TWA 의 assetlinks.json) ──
    #  ⚠⚠ [라운드308] 바로 아래 숨김파일 차단 규칙(location ~ /\.)은 정규식이라,
    #    접두사 매칭 location 이 ^~ 없이 이겨도 nginx 는 그 뒤에 정규식들을
    #    파일 순서대로 마저 검사한다 — 접두사가 더 길어도, 파일에서 더 위에
    #    있어도 소용없다(둘 다 실측 확인). 그래서 /.well-known/ 도 "숨김파일"
    #    로 걸려 nginx 단에서 그냥 404 가 났다. **^~ 를 반드시 붙여야** 그
    #    시점에 확정되어 아래 정규식 검사 자체를 안 탄다. 포트 80 블록엔
    #    인증서 갱신용 예외(/.well-known/acme-challenge/)가 이미 있는데
    #    443 블록엔 짝이 없었다 — deploy/앱스토어_배포_가이드.md 가 안내하는
    #    assetlinks.json 경로가 이 규칙에 조용히 막혀 있었다(구글 검증기가
    #    404 를 받아, 패키징된 앱의 주소창이 안 사라지는데 원인은 어디에도
    #    안 남는다). /static/ 과 같은 alias 패턴으로 실제 디렉터리를 둔다 —
    #    그 디렉터리에 assetlinks.json 을 넣으면 된다.
    location ^~ /.well-known/ {
        alias /opt/bokguon/.well-known/;
        try_files $uri =404;
    }

    # 숨김 파일 접근 차단 (.env, .git 등)
    location ~ /\. {
        deny all;
        return 404;
    }
}
